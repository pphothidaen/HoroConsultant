[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "rust_core"
requires-python = ">=3.10"
dynamic = ["version"]

[tool.maturin]
bindings = "pyo3"
features = ["python-extension"]
module-name = "rust_core._native"
python-source = ".."
exclude = [
    "rust_core/*.so",
    "rust_core/*.dylib",
    "rust_core/target",
]
