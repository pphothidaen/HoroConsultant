[package]
name    = "rust_core"
version = "0.1.0"
edition = "2021"

[lib]
name   = "rust_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3       = { version = "0.21", features = ["extension-module"] }
rayon      = "1.10"       # parallel iterators (multi-core)
ndarray    = "0.15"       # array ops
regex      = "1.10"
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio      = { version = "1.38", features = ["full"] }
axum       = "0.7"
reqwest    = { version = "0.12", features = ["json"] }
chrono     = { version = "0.4", features = ["serde"] }
lazy_static = "1.5"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
panic         = "abort"
