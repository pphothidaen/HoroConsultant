[package]
name    = "rust_core"
version = "0.1.0"
edition = "2021"

[lib]
name   = "rust_core"
crate-type = ["cdylib"]

[dependencies]
pyo3     = { version = "0.21", features = ["extension-module"] }
rayon    = "1.10"       # parallel iterators (multi-core)
ndarray  = "0.15"       # array ops

[profile.release]
opt-level   = 3
lto         = true
codegen-units = 1
panic       = "abort"
