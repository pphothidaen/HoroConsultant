[package]
name    = "rust_core"
version = "0.1.0"
edition = "2021"

[lib]
name   = "rust_core"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = [
    "dep:pyo3",
    "dep:rayon",
    "dep:ndarray",
    "dep:regex",
    "dep:serde",
    "dep:serde_json",
    "dep:chrono",
    "dep:lazy_static",
]
python-extension = ["python", "pyo3/extension-module"]
server = ["python", "dep:tokio", "dep:axum", "dep:reqwest"]

[dependencies]
pyo3       = { version = "0.21", optional = true, features = ["abi3-py310"] }
rayon      = { version = "1.10", optional = true }       # parallel iterators (multi-core)
ndarray    = { version = "0.15", optional = true }       # array ops
regex      = { version = "1.10", optional = true }
serde      = { version = "1.0", optional = true, features = ["derive"] }
serde_json = { version = "1.0", optional = true }
tokio      = { version = "1.38", optional = true, features = ["full"] }
axum       = { version = "0.7", optional = true }
reqwest    = { version = "0.12", optional = true, features = ["json"] }
chrono     = { version = "0.4", optional = true, features = ["serde"] }
lazy_static = { version = "1.5", optional = true }

[[test]]
name = "test_engines"
required-features = ["server"]

[[test]]
name = "test_vector_search"
required-features = ["python"]

[[test]]
name = "test_runtime_contract"
required-features = ["python"]

[[bin]]
name = "audit_suite"
path = "src/bin/audit_suite.rs"
required-features = ["server"]

[[bin]]
name = "button_regression"
path = "src/bin/button_regression.rs"
required-features = ["server"]

[[bin]]
name = "chart_generator"
path = "src/bin/chart_generator.rs"
required-features = ["server"]

[[bin]]
name = "code_reviewer"
path = "src/bin/code_reviewer.rs"
required-features = ["server"]

[[bin]]
name = "fusion_synthesizer"
path = "src/bin/fusion_synthesizer.rs"
required-features = ["server"]

[[bin]]
name = "horo_benchmark"
path = "src/bin/horo_benchmark.rs"
required-features = ["server"]

[[bin]]
name = "horo_server"
path = "src/bin/horo_server.rs"
required-features = ["server"]

[[bin]]
name = "regression_runner"
path = "src/bin/regression_runner.rs"
required-features = ["server"]

[[bin]]
name = "sdlc_watchdog"
path = "src/bin/sdlc_watchdog.rs"
required-features = ["server"]

[[bin]]
name = "svg_chart_cli"
path = "src/bin/svg_chart_cli.rs"
required-features = ["server"]

[[bin]]
name = "sync_sdlc_agents"
path = "src/bin/sync_sdlc_agents.rs"
required-features = ["server"]

[[bin]]
name = "telemetry_daemon"
path = "src/bin/telemetry_daemon.rs"
required-features = ["server"]

[[bin]]
name = "vercel_curl_regression"
path = "src/bin/vercel_curl_regression.rs"
required-features = ["server"]

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
panic         = "unwind"
