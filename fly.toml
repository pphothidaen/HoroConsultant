# fly.toml app configuration for HoroConsultant Core Backend
# Target Region: Singapore (sin) for low latency to Thailand (< 30ms)

app = "horoconsultant-core-backend"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile.hf"

[env]
  PORT = "7860"
  ADMIN_ALLOWED_EMAILS = "pansakorn@gmail.com,kimlenglim.work@gmail.com"

[[services]]
  protocol = "tcp"
  internal_port = 7860
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
    method = "get"
    path = "/health"
    protocol = "http"
