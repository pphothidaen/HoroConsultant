# ==============================================================================
# Gemini-Sonnet Parity Configuration
# .agents/config/gemini_parity.yaml
# ==============================================================================
# กำหนด mapping ระหว่าง virtual model IDs (จาก 9router) กับ
# Gemini Parity profiles เพื่อให้ Gemini 3.6 Flash ทำงานได้
# เทียบเท่า Claude Sonnet 4.6 ในแต่ละ task context
# ==============================================================================

version: "2.0.0"
description: >
  Gemini-Sonnet Parity Engine Configuration.
  Activated automatically by hermes_model_parity.py when Hermes routes
  to Gemini 3.6 Flash (medium) instead of Claude Sonnet 4.6 (high).

# ── Activation Conditions ────────────────────────────────────────────────────
activation:
  # Parity mode is ON when the resolved model is Gemini AND parity is enabled
  trigger_models:
    - "gemini-2.0-flash"
    - "gemini-2.0-flash-lite"
    - "gemini-1.5-pro"
    - "gemini-2.5-flash"
    - "gemini-3.6-flash"
    - "gemini-3.6-medium"
    - "gemini-3.7-flash"
    - "gemini-3.7-flash-thinking"
    - "gemini-3.7-flash (high)"
    - "gpt-oss-120b"
    - "Gemini 3.7 Flash Medium Fast O"
    - "Gemini 3.6 Flash Medium Fast O"
    - "Gemini 3.5 Flash Medium Fast O"
    - "Gemini 3.1 Pro Low"
    - "Claude Sonnet 4.6 (Thinking)"
    - "Claude Opus 4.6 (Thinking)"
    - "GPT-OSS 120B (Medium)"
  env_flag: "HERMES_PARITY_ENABLED"   # Set to "true" to activate (default: true on Gemini)
  auto_detect_task: true               # Auto-select task profile from message content

# ── Virtual Model → Parity Profile Mapping ──────────────────────────────────
# 9router ส่ง virtual model ID มา → hermes_model_parity.py map ไปยัง profile
virtual_model_mapping:
  "claude-3-7-sonnet":   "orchestration"   # Orchestrator tasks → orchestration profile
  "deepseek-v3":         "coding"          # Developer tasks → coding profile
  "deepseek-r1":         "coding"          # Code review → coding (strict mode)
  "gpt-4o-mini":         "qa"              # QA tasks → qa profile
  "gemini-2.0-flash":    "auto"            # Auto-detect from message content
  "gemini-sonnet-parity": "auto"           # Explicit parity virtual model

# ── AGY Profile Routing Matrix (Complexity-aware) ───────────────────────
agy_routing:
  enabled: true
  roles:
    analysis:
      low:
        model: "Gemini 3.5 Flash Medium Fast O"
        time: "fast"
      medium:
        model: "Gemini 3.6 Flash Medium Fast O"
        time: "medium"
      high:
        model: "Gemini 3.7 Flash Medium Fast O"
        time: "medium"
      fallback:
        model: "Gemini 3.1 Pro Low"
        time: "low"
    implementation:
      low:
        model: "Gemini 3.6 Flash Medium Fast O"
        time: "fast"
      medium:
        model: "Gemini 3.7 Flash Medium Fast O"
        time: "medium"
      high:
        model: "GPT-OSS 120B (Medium)"
        time: "medium"
      fallback:
        model: "Gemini 3.1 Pro Low"
        time: "low"
    review:
      low:
        model: "Gemini 3.5 Flash Medium Fast O"
        time: "fast"
      medium:
        model: "Gemini 3.7 Flash Medium Fast O"
        time: "medium"
      high:
        model: "Claude Opus 4.6 (Thinking)"
        time: "high"
      fallback:
        model: "Gemini 3.1 Pro Low"
        time: "low"

  agents:
    - name: "agy1"
      default_profile: "analysis"
      routing:
        analysis:
          low:
            model: "Gemini 3.5 Flash Medium Fast O"
            time: "fast"
          medium:
            model: "Gemini 3.6 Flash Medium Fast O"
            time: "medium"
          high:
            model: "Gemini 3.7 Flash Medium Fast O"
            time: "medium"
        implementation:
          low:
            model: "Gemini 3.6 Flash Medium Fast O"
            time: "fast"
          medium:
            model: "Gemini 3.7 Flash Medium Fast O"
            time: "medium"
          high:
            model: "GPT-OSS 120B (Medium)"
            time: "medium"
        review:
          low:
            model: "Gemini 3.5 Flash Medium Fast O"
            time: "fast"
          medium:
            model: "Gemini 3.7 Flash Medium Fast O"
            time: "medium"
          high:
            model: "Claude Opus 4.6 (Thinking)"
            time: "high"

    - name: "agy2"
      default_profile: "implementation"
      routing:
        analysis:
          low:
            model: "Gemini 3.5 Flash Medium Fast O"
            time: "fast"
          medium:
            model: "Gemini 3.6 Flash Medium Fast O"
            time: "medium"
          high:
            model: "Gemini 3.7 Flash Medium Fast O"  # v2: was Claude Sonnet 4.6 — demoted for quota sustainability
            time: "medium"
        implementation:
          low:
            model: "Gemini 3.6 Flash Medium Fast O"
            time: "fast"
          medium:
            model: "GPT-OSS 120B (Medium)"
            time: "medium"
          high:
            model: "GPT-OSS 120B (Medium)"  # v2: was Claude Opus 4.6 — demoted for quota sustainability
            time: "medium"
        review:
          low:
            model: "Gemini 3.6 Flash Medium Fast O"
            time: "fast"
          medium:
            model: "Gemini 3.7 Flash Medium Fast O"  # v2: was Claude Sonnet 4.6 — demoted for quota sustainability
            time: "medium"
          high:
            model: "GPT-OSS 120B (Medium)"  # v2: was Claude Opus 4.6 — demoted for quota sustainability
            time: "medium"

    - name: "agy3"
      default_profile: "analysis"
      description: >
        Gemini-direct Parity fallback account. Zero Claude usage.
        Activated when agy1 and agy2 are both quota-limited or rate-limited.
        All slots use Gemini Flash with Parity Engine bridging to Sonnet-grade quality.
      routing:
        analysis:
          low:
            model: "Gemini 3.5 Flash Medium Fast O"
            time: "fast"
          medium:
            model: "Gemini 3.6 Flash Medium Fast O"
            time: "medium"
          high:
            model: "Gemini 3.7 Flash Medium Fast O"
            time: "medium"
        implementation:
          low:
            model: "Gemini 3.6 Flash Medium Fast O"
            time: "fast"
          medium:
            model: "Gemini 3.6 Flash Medium Fast O"
            time: "medium"
          high:
            model: "Gemini 3.7 Flash Medium Fast O"
            time: "medium"
        review:
          low:
            model: "Gemini 3.5 Flash Medium Fast O"
            time: "fast"
          medium:
            model: "Gemini 3.6 Flash Medium Fast O"
            time: "medium"
          high:
            model: "Gemini 3.7 Flash Medium Fast O"
            time: "medium"

  fallback_chain:
    mode: "sequential"
    triggers:
      - "not_called"
      - "quota_reached"
      - "timeout"
      - "error"
      - "overloaded"
      - "unavailable"
      - "rate_limited"
    sequence:
      - "agy1"
      - "agy2"
      - "agy3"       # v2: Gemini-direct Parity account — zero Claude, zero downtime
      - "codex_subagent"
    codex_fallback:
      model: "gpt-5.3-codex-spark high"
      via: "CODEX_PRO"
      reason: "Sequential AGY fallback exhausted (agy1→agy2→agy3 all quota-limited)"

# ── SDLC Phase → Role + Complexity + Account Mapping (v2) ────────────────────
# Source of truth for hermes_agy_router.py --phase, hermes_sdlc_runner.sh, and agentic_pipeline.sh.
# Each phase maps to the minimum complexity required — never over-allocate to Claude.
sdlc_phases:
  bsa:
    role: "analysis"
    complexity: "low"         # Docs audit, spec sync — no heavy reasoning needed
    account: "agy1"           # agy1 analysis:low → Gemini 3.5 Flash (fast)
  dev:
    role: "implementation"
    complexity: "medium"      # Code writing, bug fixes — balanced quality vs cost
    account: "agy2"           # agy2 implementation:medium → GPT-OSS 120B
  qa:
    role: "review"
    complexity: "low"         # Deterministic pytest, log parsing — minimal LLM reasoning
    account: "agy1"           # agy1 review:low → Gemini 3.5 Flash (fast)
  reviewer:
    role: "review"
    complexity: "low"         # Code reviewer runs deterministic Python script — not LLM
    account: "agy1"           # agy1 review:low → Gemini 3.5 Flash (fast)
  devops:
    role: "implementation"
    complexity: "medium"      # Secrets sync, Docker, Vercel — structured tasks
    account: "agy1"           # agy1 implementation:medium → Gemini 3.7 Flash
  orchestrator:
    role: "analysis"
    complexity: "high"        # Architecture planning, spec breakdown — highest reasoning
    account: "agy1"           # agy1 analysis:high → Gemini 3.7 Flash (Claude Opus only on review:high)


# ── Task Profiles (mirror of hermes_model_parity.py TASK_PROFILES) ──────────
profiles:
  orchestration:
    description: >
      Deep architectural reasoning — matches Claude Sonnet 4.6 High thinking.
      Used for: spec breakdown, multi-agent coordination, plans/plan.md writing.
    temperature: 0.15
    top_p: 0.92
    top_k: 40
    max_output_tokens: 8192
    thinking_depth: deep          # 3-pass: plan, critique, refine
    self_critique_rounds: 2
    effective_iq_target: "Claude Sonnet 4.6 High Thinking"

  coding:
    description: >
      Precision code synthesis — matches Claude Sonnet 4.6 coding quality.
      Used for: Python/Rust/FastAPI code writing, bug fixes, refactoring.
    temperature: 0.10
    top_p: 0.90
    top_k: 32
    max_output_tokens: 16384
    thinking_depth: medium        # 2-pass: plan, write
    self_critique_rounds: 1
    effective_iq_target: "Claude Sonnet 4.6 Standard"

  qa:
    description: >
      Pessimistic test audit — matches Claude Sonnet 4.6 analytical mode.
      Used for: pytest execution, edge case identification, security scan.
    temperature: 0.05
    top_p: 0.85
    top_k: 20
    max_output_tokens: 4096
    thinking_depth: shallow       # 1-pass: identify issues
    self_critique_rounds: 1
    effective_iq_target: "Claude Sonnet 4.6 Analytical"

  devops:
    description: >
      Infrastructure reasoning — matches Claude Sonnet 4.6 structured planning.
      Used for: Docker, Azure, Vercel, Doppler, Kaggle operations.
    temperature: 0.12
    top_p: 0.90
    top_k: 32
    max_output_tokens: 4096
    thinking_depth: medium
    self_critique_rounds: 1
    effective_iq_target: "Claude Sonnet 4.6 Standard"

  domain:
    description: >
      Metaphysics domain expert synthesis — matches Claude Sonnet 4.6 knowledge reasoning.
      Used for: BaZi, Zi Wei, Vedic, Western astrology interpretation tasks.
    temperature: 0.20
    top_p: 0.93
    top_k: 50
    max_output_tokens: 8192
    thinking_depth: deep          # 3-pass + canonical citation check
    self_critique_rounds: 2
    effective_iq_target: "Claude Sonnet 4.6 High Thinking"

# ── Context Window Settings ──────────────────────────────────────────────────
context_window:
  gemini_max_chars: 900000        # 1M token window - 100K headroom for output
  compression_strategy: sliding   # Keep system + most recent N turns
  truncation_notice: true         # Inject notice when context is compressed

# ── Quality Gate ─────────────────────────────────────────────────────────────
# Thresholds below which Hermes escalates to Orchestrator instead of retrying
quality_gate:
  min_response_length: 50         # chars — too short = likely failed generation
  max_loop_retries: 3             # total across all retry mechanisms
  escalate_on_empty: true         # escalate if Gemini returns empty content

# ── Fallback Chain (when Gemini parity still insufficient) ───────────────────
fallback_chain:
  - model: "claude-3-7-sonnet"
    via: "CODEX_PRO"
    trigger: "self_critique_rounds_exhausted AND quality_gate_failed"
  - model: "gemini-1.5-pro"
    via: "direct"
    trigger: "gemini-2.0-flash rate_limited"
