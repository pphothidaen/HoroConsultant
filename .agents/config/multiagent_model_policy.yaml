schema_version: 1
policy_version: "2026-08-26.2"
decision_schema_version: 1

feature_flags:
  enable_agy_parity: false
  enable_module_level_source_isolation: false
  enable_granular_lane_roles: false

result_contract:
  protocol_version: 2
  receipt_schema_version: 3
  work_result_schema: ../schemas/multiagent-work-result-v2.schema.json
  # New governed execution requires the locally anchored preauthorization v3 contract.
  receipt_schema: ../schemas/multiagent-dispatch-receipt-v3.schema.json
  historical_receipt_v2_schema: ../schemas/multiagent-dispatch-receipt-v2.schema.json
  # Receipt-v1 is legacy-only: preserve its identity and handle it explicitly;
  # never reinterpret or validate a historical v1 receipt as receipt-v2.
  legacy_receipt_schema: ../schemas/multiagent-dispatch-receipt-v1.schema.json
  adapters:
    codex: codex-jsonl-output-schema-v2
    agy: agy-stream-json-schema-v2
  swap_support:
    # allow_provider_swap: true on an account enables transparent codex<->agy
    # alias swapping when a role or CLI override selects the other provider.
    # Absent or false preserves strict mismatch rejection (fail-closed default).
    allow_provider_swap_default: false

preauthorization:
  probe_claim_schema_version: 1
  probe_claim_schema: ../schemas/multiagent-probe-claim-v1.schema.json
  probe_claim_ttl_seconds: 600
  approval_grant_schema_version: 1
  approval_grant_schema: ../schemas/multiagent-probe-approval-v1.schema.json
  approval_grant_ttl_seconds: 120
  approval_consume_schema_version: 1
  approval_consume_schema: ../schemas/multiagent-approval-consume-receipt-v1.schema.json
  bind_store_identities:
    - probe_claim_store
    - approval_grant_store
    - approval_consume_store
    - dispatch_ledger_store
  reject_symlink_rename_copy_aliases: true
  retain_verified_descriptors_through_spawn: true
  dispatch_ledger_consume_anchor_required: true
  consume_raw_digest_and_timestamp_anchored: true
  max_uses: 1
  expiry_grace_seconds: 0
  current_session_only: true
  attestation_scope: local-single-host-nonportable-noncryptographic-attestation
  authenticity_claimed: false
  metadata_retention_days: 90
  manual_compaction_only: true
  indefinite_tombstone: true
  raw_streams_retained: false

# QuotaObservation v1 is content-free, canonical, and single-use. Runtime
# consumers must reject stale/future/replayed or contradictory observations,
# revalidate the exact artifact and provenance, and bind those values
# transitively into receipt protocol v2. DispatchDecision schema v1 is
# deliberately absent from executable_decision_schema_versions.
quota_observation:
  schema_version: 1
  protocol_version: 1
  canonicalization_version: 1
  observation_schema: ../schemas/multiagent-quota-observation-v1.schema.json
  artifact_schema: ../schemas/multiagent-quota-observation-artifact-v1.schema.json
  observation_domain: horoconsultant.multiagent.quota-observation.v1
  artifact_domain: horoconsultant.multiagent.quota-observation-artifact.v1
  maximum_age_seconds: 60
  future_tolerance_seconds: 5
  threshold_percent: 10
  executable_decision_schema_versions: []
  receipt_protocol_version: 2

# The orchestrator classifies a lane.  This catalog only validates the
# resulting selection; it never lowers a quality floor because of quota.
rank_dimensions:
  - scope_rank
  - complexity_rank
  - risk_rank
  - ambiguity_rank
  - evidence_burden_rank
rank_min: 0
rank_max: 3
broad_scope_rank: 2
high_risk_rank: 2
critical_rank: 3

phases:
  - planning
  - implementation
  - qa
  - review
  - release
  - operations
work_modes:
  - read_only
  - mutation
quota_bands:
  - healthy
  - constrained
  - below_10_percent
  - unknown

quality_floors:
  0:
    reference_profile: gpt-5.6-luna/low
    profile: gpt-5.6-luna/low
  1:
    reference_profile: gpt-5.6-luna/medium
    profile: gpt-5.6-luna/medium
  2:
    reference_profile: gpt-5.6-terra/high
    profile: gpt-5.6-terra/high
  3:
    reference_profile: gpt-5.6-sol/high
    profile: gpt-5.6-sol/high

# quality_rank is the strongest lane floor that an exact model/effort pair
# may satisfy.  max/ultra are executable only on entries explicitly marked as
# quality exceptions and require a decision-level quality_exception rationale.
models:
  gpt-5.6-sol:
    cli: codex
    availability: true
    deprecated: false
    fallback_order: 1
    efforts:
      low: {quality_rank: 0}
      medium: {quality_rank: 2}
      high: {quality_rank: 3}
      xhigh: {quality_rank: 3}
      max: {quality_rank: 3, quality_exception: true}
      ultra: {quality_rank: 3, quality_exception: true}
  gpt-5.6-terra:
    cli: codex
    availability: true
    deprecated: false
    fallback_order: 2
    efforts:
      low: {quality_rank: 0}
      medium: {quality_rank: 1}
      high: {quality_rank: 2}
      xhigh: {quality_rank: 2}
      max: {quality_rank: 2, quality_exception: true}
      ultra: {quality_rank: 2, quality_exception: true}
  gpt-5.6-luna:
    cli: codex
    availability: true
    deprecated: false
    fallback_order: 3
    efforts:
      low: {quality_rank: 0}
      medium: {quality_rank: 1}
      high: {quality_rank: 1}
      xhigh: {quality_rank: 1}
  # First-priority Codex profile for the DevOps and code-review safety lanes.
  # Runtime availability still requires a provider-native receipt.
  gpt-5.3-codex-spark:
    cli: codex
    availability: true
    deprecated: false
    fallback_order: 4
    allowed_roles: ["devops", "code_reviewer"]
    allowed_phases: ["qa", "review", "release", "operations"]
    efforts:
      high: {quality_rank: 3}
  gemini-3.7-flash-low:
    cli: agy
    availability: true
    deprecated: false
    fallback_order: 5
    efforts:
      low: {quality_rank: 0}
  gemini-3.7-flash-medium:
    cli: agy
    availability: true
    deprecated: false
    fallback_order: 4
    efforts:
      medium: {quality_rank: 1}
  gemini-3.7-flash-high:
    cli: agy
    availability: true
    deprecated: false
    fallback_order: 2
    efforts:
      high: {quality_rank: 2}
  gemini-3.1-pro-low:
    cli: agy
    availability: true
    deprecated: false
    fallback_order: 3
    efforts:
      low: {quality_rank: 0}
  gemini-3.1-pro-high:
    cli: agy
    availability: true
    deprecated: false
    fallback_order: 1
    efforts:
      high: {quality_rank: 2}

# Rank-3 planning is the solution/ticket-design exception described by the
# governance plan.  A normal rank-3 executable lane needs high; rank-3
# planning needs xhigh (or an explicitly cataloged max/ultra exception).
rank_3_planning:
  model: gpt-5.6-sol
  efforts: [xhigh, max, ultra]
