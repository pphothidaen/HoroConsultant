# Cloudflare Workers configuration for horoconsultant
# This is the MAIN entry point for Workers deployments (not Pages)
name = "horoconsultant-production"
main = "project/static/_worker.js"
# account_id required for Workers deploy — NOT supported in Pages projects
compatibility_date = "2026-09-22"
compatibility_flags = ["nodejs_compat"]
account_id = "bda49e4e77e00609cb1ef68561b0d9eb"

[vars]
BACKEND_BASE_URL = "https://pphothidaen-horoconsultant-core-backend.hf.space"
BACKEND_TIMEOUT_MS = "15000"
CORS_ALLOWED_ORIGINS = "https://horoconsultant.yourdomain.com"
ENVIRONMENT = "production"
HF_TOKEN = ""  # Set via wrangler secret put HF_TOKEN

# KV namespace for caching
[[kv_namespaces]]
binding = "CACHE"
id = "07d1f31739eb418b944bf8d66f17a452"

# NOTE: no R2 bucket binding here. R2 is not enabled on this Cloudflare
# account (deploy fails with API error 10042 "Please enable R2"), so any R2
# entry fails `wrangler deploy` outright. project/static/_worker.js does not reference
# env.ARTIFACTS; project/static/_worker.js (Pages) degrades gracefully
# without the binding. Re-add only after R2 is enabled and the bucket
# horoconsultant-artifacts exists.

# Cron triggers for periodic tasks
[triggers]
crons = ["0 0 * * *", "0 */6 * * *"]

[observability]
enabled = true

# Env variables synced from Doppler
# DO NOT hardcode secrets here — use `doppler run -- wrangler deploy`
[env.preview]
vars = { ENVIRONMENT = "preview" }

[env.production]
name = "horoconsultant-production"
vars = { ENVIRONMENT = "production" }
