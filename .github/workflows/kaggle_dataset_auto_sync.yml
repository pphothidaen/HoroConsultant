name: Kaggle Dataset Automated Inspection & Sync Schedule

on:
  schedule:
    # Run daily at 00:00 UTC (07:00 AM Bangkok Time)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force_upload:
        description: 'Force upload new Kaggle dataset version even if no checksum change'
        required: false
        type: boolean
        default: false
  repository_dispatch:
    types: [kaggle-dataset-sync, gdrive-new-document]

jobs:
  kaggle_dataset_sync:
    name: Inspect Sources & Sync Kaggle Dataset
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install kaggle gdown python-dotenv requests pydantic

      - name: Configure Kaggle Credentials
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_TOKEN || secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle
          echo "{\"username\":\"${KAGGLE_USERNAME:-pphothidaen}\",\"key\":\"${KAGGLE_KEY}\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Run Automated Inspection & Kaggle Dataset Sync
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_TOKEN || secrets.KAGGLE_KEY }}
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force_upload }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python3 scripts/kaggle_dataset_sync_automation.py --sync $FORCE_FLAG

      - name: Commit Updated Manifest and Dataset Sync Status
        run: |
          git config --global user.name "HoroConsultant-Bot"
          git config --global user.email "bot@horoconsultant.local"
          git add project/data/kaggle_sync_manifest.json project/kaggle_kernel/my_dataset/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): auto-update kaggle sync manifest & dataset files" && git push origin main)
