name: NotebookLM Cookie Health Heartbeat

on:
  schedule:
    # Run daily at 00:00 UTC (07:00 AM Bangkok Time)
    - cron: '0 0 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [check-cookie-heartbeat, heartbeat]

jobs:
  cookie-heartbeat:
    name: Check Google Session Cookie Validity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv pydantic

      - name: Evaluate Google Session Cookie Validity
        env:
          NOTEBOOKLM_SESSION_COOKIE: ${{ secrets.NOTEBOOKLM_SESSION_COOKIE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python3 scripts/check_cookie_heartbeat.py --silent-if-ok --json --warn-only
