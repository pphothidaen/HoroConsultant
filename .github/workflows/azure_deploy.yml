# ==============================================================================
# HoroConsultant — Azure Container Apps Deployment Workflow (GitHub Actions)
# ==============================================================================
# Triggers on git push to main -> builds Docker image -> pushes to Docker Hub ->
# deploys to Azure Container Apps (horoconsult-env-new / rg-horoconsult) ->
# runs Hermes Headless Post-Deploy E2E Verification.
#
# Adheres to Rule 06: 2-Tier Priority Secrets Policy:
#   1st Priority: Doppler Cloud Secrets Vault (DOPPLER_TOKEN)
#   2nd Priority: GitHub Repository Secrets (AZURE_*, DOCKER_*)
# ==============================================================================

name: Azure Container Apps — Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force Docker rebuild even if no code changes'
        required: false
        default: 'false'

env:
  CI: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-push:
    name: Build & Push Docker Image to Docker Hub
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.sha_short }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Extract Short Git Commit Hash
        id: meta
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Doppler Secret Sync (1st Priority)
        uses: dopplerhq/secrets-fetch-action@v1.2.0
        continue-on-error: true
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
        id: doppler

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME || secrets.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD || secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.hf
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME || secrets.DOCKER_USERNAME }}/horoconsult:latest
            ${{ env.DOCKER_USERNAME || secrets.DOCKER_USERNAME }}/horoconsult:${{ steps.meta.outputs.sha_short }}
          build-args: |
            GIT_COMMIT_HASH=${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-azure:
    name: Deploy to Azure Container Apps (Southeast Asia)
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Doppler Secret Sync (1st Priority)
        uses: dopplerhq/secrets-fetch-action@v1.2.0
        continue-on-error: true
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
        id: doppler

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ env.AZURE_CREDENTIALS || secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ env.AZURE_RESOURCE_GROUP || secrets.AZURE_RESOURCE_GROUP }}
          containerAppName: ${{ env.AZURE_CONTAINER_APP || secrets.AZURE_CONTAINER_APP }}
          imageToDeploy: ${{ env.DOCKER_USERNAME || secrets.DOCKER_USERNAME }}/horoconsult:${{ needs.build-and-push.outputs.image_tag }}

      - name: Verify Azure Container App Health
        run: |
          echo "[INFO] Waiting 30s for container app to stabilize..."
          sleep 30
          HEALTH_URL="${{ env.AZURE_CONTAINER_APP_URL || secrets.AZURE_CONTAINER_APP_URL }}/health"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$HEALTH_URL" || echo "000")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "[OK] Azure Container App health check PASSED (HTTP $HTTP_STATUS)"
          else
            echo "[ERROR] Azure Container App health check FAILED (HTTP $HTTP_STATUS)"
            exit 1
          fi

      - name: Azure Logout
        if: always()
        run: az logout

  hermes-post-deploy:
    name: Hermes Headless — Post-Deploy E2E Verification
    runs-on: ubuntu-latest
    needs: deploy-azure
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Doppler Secret Sync (1st Priority)
        uses: dopplerhq/secrets-fetch-action@v1.2.0
        continue-on-error: true
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
        id: doppler

      - name: Install Dependencies
        run: |
          pip install httpx python-dotenv rich typer

      - name: Run Live E2E Network Audit (Hermes Headless Mode)
        env:
          AZURE_CONTAINER_APP_URL: ${{ env.AZURE_CONTAINER_APP_URL || secrets.AZURE_CONTAINER_APP_URL }}
          # 9router routing: use ROUTER_BASE_URL if set, else fallback to CODEX_PRO
          ROUTER_BASE_URL: ${{ env.ROUTER_BASE_URL || secrets.ROUTER_BASE_URL }}
          CODEX_PRO: ${{ env.CODEX_PRO || secrets.CODEX_PRO }}
          GOOGLE_AI_STUDIO_API_KEY: ${{ env.GOOGLE_AI_STUDIO_API_KEY || secrets.GOOGLE_AI_STUDIO_API_KEY }}
          OPENAI_BASE_URL: ${{ env.ROUTER_BASE_URL || secrets.ROUTER_BASE_URL }}
          OPENAI_API_KEY: ${{ env.NINE_ROUTER_API_KEY || secrets.NINE_ROUTER_API_KEY || 'dummy' }}
        run: |
          python3 scripts/test_live_e2e_network.py || echo "[WARNING] E2E audit completed with warnings"
