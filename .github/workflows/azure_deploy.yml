# ==============================================================================
# HoroConsultant — Azure Container Apps Deployment Workflow (GitHub Actions)
# ==============================================================================
# Azure ingress is currently unavailable. This legacy workflow remains manual
# only for internal maintenance; public production deploys use
# hf_backend_deploy.yml instead.
#
# Adheres to Rule 06: 2-Tier Priority Secrets Policy:
#   1st Priority: Doppler Cloud Secrets Vault (DOPPLER_TOKEN)
#   2nd Priority: GitHub Repository Secrets (AZURE_*, DOCKER_*)
# ==============================================================================

name: Azure Container Apps — Production Deployment

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force Docker rebuild even if no code changes'
        required: false
        default: 'false'

env:
  CI: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-push:
    name: Build & Push Docker Image to Docker Hub
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.sha_short }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Extract Short Git Commit Hash
        id: meta
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Doppler Secret Sync (1st Priority)
        uses: dopplerhq/secrets-fetch-action@v1.2.0
        continue-on-error: true
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
        id: doppler

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME || secrets.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD || secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.hf
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME || secrets.DOCKER_USERNAME }}/horoconsult:latest
            ${{ env.DOCKER_USERNAME || secrets.DOCKER_USERNAME }}/horoconsult:${{ steps.meta.outputs.sha_short }}
          build-args: |
            GIT_COMMIT_HASH=${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-azure:
    name: Deploy to Azure Container Apps (Southeast Asia)
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Doppler Secret Sync (1st Priority)
        uses: dopplerhq/secrets-fetch-action@v1.2.0
        continue-on-error: true
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
        id: doppler

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ env.AZURE_CREDENTIALS || secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ env.AZURE_RESOURCE_GROUP || secrets.AZURE_RESOURCE_GROUP }}
          containerAppName: ${{ env.AZURE_CONTAINER_APP || secrets.AZURE_CONTAINER_APP }}
          imageToDeploy: ${{ env.DOCKER_USERNAME || secrets.DOCKER_USERNAME }}/horoconsult:${{ needs.build-and-push.outputs.image_tag }}

      - name: Verify Azure Container App Health
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request

          url = os.environ["AZURE_CONTAINER_APP_URL"].rstrip("/") + "/health"
          for attempt in range(1, 7):
              try:
                  with urllib.request.urlopen(url, timeout=15) as response:
                      payload = json.loads(response.read().decode("utf-8"))
                  if response.status == 200 and payload.get("status") in {"ok", "healthy", "running", "alive", "up"}:
                      print(f"[OK] Azure Container App health check passed on attempt {attempt}")
                      raise SystemExit(0)
                  print(f"[WARNING] Health payload not ready on attempt {attempt}: {payload}")
              except Exception as error:
                  print(f"[WARNING] Health check attempt {attempt} failed: {error}")
              time.sleep(10)
          print("[ERROR] Azure Container App health check failed")
          raise SystemExit(1)
          PY
        env:
          AZURE_CONTAINER_APP_URL: ${{ env.AZURE_CONTAINER_APP_URL || secrets.AZURE_CONTAINER_APP_URL }}

      - name: Azure Logout
        if: always()
        run: az logout

  hermes-post-deploy:
    name: Hermes Headless — Post-Deploy E2E Verification
    runs-on: ubuntu-latest
    needs: deploy-azure
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Doppler Secret Sync (1st Priority)
        uses: dopplerhq/secrets-fetch-action@v1.2.0
        continue-on-error: true
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
        id: doppler

      - name: Install Dependencies
        run: |
          pip install httpx python-dotenv rich typer

      - name: Run strict production path verification
        env:
          AZURE_CONTAINER_APP_URL: ${{ env.AZURE_CONTAINER_APP_URL || secrets.AZURE_CONTAINER_APP_URL }}
          VERCEL_GATEWAY_URL: ${{ vars.VERCEL_GATEWAY_URL || 'https://horo-consultant-psi.vercel.app' }}
          HF_STATIC_CDN_URL: ${{ vars.HF_STATIC_CDN_URL || 'https://pphothidaen-horoconsultant-core-backend.static.hf.space' }}
        run: |
          python3 scripts/run_live_health_verification.py --require-azure --json-output production-verification.json

      - name: Run production synthetic monitor
        env:
          AZURE_CONTAINER_APP_URL: ${{ env.AZURE_CONTAINER_APP_URL || secrets.AZURE_CONTAINER_APP_URL }}
          VERCEL_GATEWAY_URL: ${{ vars.VERCEL_GATEWAY_URL || 'https://horo-consultant-psi.vercel.app' }}
          HF_STATIC_CDN_URL: ${{ vars.HF_STATIC_CDN_URL || 'https://pphothidaen-horoconsultant-core-backend.static.hf.space' }}
        run: |
          python3 scripts/synthetic_health_monitor.py --once --require-azure --json-output synthetic-health.json

      - name: Upload production verification reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-verification-${{ github.sha }}
          path: |
            production-verification.json
            synthetic-health.json
          if-no-files-found: warn
