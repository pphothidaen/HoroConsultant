name: "[RETIRED] Azure Container Apps Manual Deployment"

# Audit-only tombstone. The job is statically disabled and receives no
# credentials, so manual dispatch cannot mutate Azure or enable ingress.
on:
  workflow_dispatch:

permissions: {}

jobs:
  retired:
    name: Azure manual deployment is prohibited
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Retirement notice
        run: |
          echo "::error::Azure public ingress is blocked by repository policy."
          exit 1
