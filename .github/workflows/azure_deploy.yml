# ==============================================================================
# HoroConsultant — Azure Container Apps Deployment Workflow (GitHub Actions)
# ==============================================================================
# Azure ingress is currently unavailable. This legacy workflow remains manual
# only for internal maintenance; public production deploys use
# hf_backend_deploy.yml instead.
#
# Adheres to Rule 06: 2-Tier Priority Secrets Policy:
#   1st Priority: Doppler Cloud Secrets Vault (DOPPLER_TOKEN)
#   2nd Priority: GitHub Repository Secrets (AZURE_*, DOCKER_*)
# ==============================================================================

name: Azure Container Apps — Production Deployment

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force Docker rebuild even if no code changes'
        required: false
        default: 'false'

env:
  CI: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-push:
    name: Build & Push Docker Image to Docker Hub
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.sha_short }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Extract Short Git Commit Hash
        id: meta
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Doppler Secret Sync (1st Priority)
        uses: dopplerhq/secrets-fetch-action@v1.2.0
        continue-on-error: true
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
        id: doppler

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME || env.DOCKER_USERNAME || secrets.DOCKER_USERNAME }}
          password: ${{ vars.DOCKER_PASSWORD || env.DOCKER_PASSWORD || secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKER_USERNAME || env.DOCKER_USERNAME || secrets.DOCKER_USERNAME }}/horoconsult:latest
            ${{ vars.DOCKER_USERNAME || env.DOCKER_USERNAME || secrets.DOCKER_USERNAME }}/horoconsult:${{ steps.meta.outputs.sha_short }}
          build-args: |
            GIT_COMMIT_HASH=${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-azure:
    name: Deploy to Azure Container Apps (Southeast Asia)
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    outputs:
      azure_container_app_url: ${{ steps.resolve-azure-url.outputs.url }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Doppler Secret Sync (1st Priority)
        uses: dopplerhq/secrets-fetch-action@v1.2.0
        continue-on-error: true
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
        id: doppler

      - name: Resolve Azure credentials
        id: resolve-azure-creds
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys

          placeholders = {
              "AZURE_CLIENT_ID": os.getenv("AZURE_CLIENT_ID", ""),
              "AZURE_CLIENT_SECRET": os.getenv("AZURE_CLIENT_SECRET", ""),
              "AZURE_SUBSCRIPTION_ID": os.getenv("AZURE_SUBSCRIPTION_ID", ""),
              "AZURE_TENANT_ID": os.getenv("AZURE_TENANT_ID", ""),
          }

          parsed = None
          used_template_placeholders = set()
          raw = os.getenv("AZURE_CREDENTIALS")
          if raw:
              pattern = re.compile(r"\$\{([A-Z0-9_]+)\}")
              def substitute_placeholder(match):
                  name = match.group(1)
                  used_template_placeholders.add(name)
                  return placeholders.get(name, match.group(0))

              resolved = pattern.sub(substitute_placeholder, raw)
              try:
                  parsed = json.loads(resolved)
              except json.JSONDecodeError as error:
                  print(f"[WARN] Could not parse AZURE_CREDENTIALS after substitution: {error}")
          else:
              print("[WARN] AZURE_CREDENTIALS is not available in this workflow context; attempting field assembly from individual env vars.")

          if parsed is None:
              parsed = {
                  "clientId": placeholders["AZURE_CLIENT_ID"],
                  "clientSecret": placeholders["AZURE_CLIENT_SECRET"],
                  "subscriptionId": placeholders["AZURE_SUBSCRIPTION_ID"],
                  "tenantId": placeholders["AZURE_TENANT_ID"],
              }

          fallback_fields = {
              "clientId": "AZURE_CLIENT_ID",
              "clientSecret": "AZURE_CLIENT_SECRET",
              "subscriptionId": "AZURE_SUBSCRIPTION_ID",
              "tenantId": "AZURE_TENANT_ID",
          }
          filled_from_individual = []
          for key, env_name in fallback_fields.items():
              if not str(parsed.get(key, "")).strip() and placeholders.get(env_name):
                  parsed[key] = placeholders[env_name]
                  filled_from_individual.append(key)
          if filled_from_individual:
              print(
                  "[OK] Filled missing Azure credential fields from individual secrets: "
                  + ", ".join(filled_from_individual)
              )

          if raw and used_template_placeholders:
              missing_placeholders = [
                  name for name in sorted(used_template_placeholders)
                  if not placeholders.get(name)
              ]
              if missing_placeholders:
                  print("[ERROR] AZURE_CREDENTIALS references unresolved placeholders:")
                  for name in missing_placeholders:
                      print(f"[ERROR] - {name}")
                  print("[ERROR] Provide each referenced value via Doppler Secrets, repository secrets, or workflow environment.")
                  sys.exit(1)

          for key in ("clientId", "clientSecret", "subscriptionId", "tenantId"):
              if not str(parsed.get(key, "")).strip():
                  print(f"[ERROR] Missing resolved credential field: {key}")
                  sys.exit(1)
              if "${" in str(parsed.get(key, "")):
                  print(f"[ERROR] Unresolved placeholder detected in credential field {key}: {parsed.get(key)}")
                  sys.exit(1)

          if raw:
              print(f"[OK] Resolved Azure credentials from AZURE_CREDENTIALS template payload.")
          else:
              print("[OK] Resolved Azure credentials from individual AZURE_* environment fields.")

          output_file = os.environ["GITHUB_OUTPUT"]
          with open(output_file, "a", encoding="utf-8") as output:
              output.write(f"json={json.dumps(parsed)}\n")
              output.write(f"subscription_id={parsed['subscriptionId']}\n")
          print("[OK] Resolved Azure credentials for deployment.")
          PY
        env:
          AZURE_CREDENTIALS: ${{ vars.AZURE_CREDENTIALS || env.AZURE_CREDENTIALS || secrets.AZURE_CREDENTIALS }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || env.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ vars.AZURE_CLIENT_SECRET || env.AZURE_CLIENT_SECRET || secrets.AZURE_CLIENT_SECRET }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || env.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID || env.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ steps.resolve-azure-creds.outputs.json }}

      - name: Preflight Azure target access
        env:
          AZURE_SUBSCRIPTION_ID: ${{ steps.resolve-azure-creds.outputs.subscription_id }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || env.AZURE_RESOURCE_GROUP || secrets.AZURE_RESOURCE_GROUP }}
          AZURE_CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP || env.AZURE_CONTAINER_APP || secrets.AZURE_CONTAINER_APP }}
        run: |
          set -euo pipefail
          test -n "${AZURE_SUBSCRIPTION_ID}" || { echo "[ERROR] AZURE_SUBSCRIPTION_ID is missing"; exit 1; }
          test -n "${AZURE_RESOURCE_GROUP}" || { echo "[ERROR] AZURE_RESOURCE_GROUP is missing"; exit 1; }
          test -n "${AZURE_CONTAINER_APP}" || { echo "[ERROR] AZURE_CONTAINER_APP is missing"; exit 1; }
          az account set --subscription "${AZURE_SUBSCRIPTION_ID}"
          if ! az group show --name "${AZURE_RESOURCE_GROUP}" --subscription "${AZURE_SUBSCRIPTION_ID}" --only-show-errors >/dev/null; then
            echo "[ERROR] Azure identity cannot read target resource group '${AZURE_RESOURCE_GROUP}'."
            echo "[ERROR] Grant the deployment service principal Reader/Contributor access on this resource group, then rerun."
            exit 1
          fi
          echo "[OK] Azure target resource group is readable; deployment can proceed to Container Apps provisioning."

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ vars.AZURE_RESOURCE_GROUP || env.AZURE_RESOURCE_GROUP || secrets.AZURE_RESOURCE_GROUP }}
          containerAppName: ${{ vars.AZURE_CONTAINER_APP || env.AZURE_CONTAINER_APP || secrets.AZURE_CONTAINER_APP }}
          imageToDeploy: ${{ vars.DOCKER_USERNAME || env.DOCKER_USERNAME || secrets.DOCKER_USERNAME }}/horoconsult:${{ needs.build-and-push.outputs.image_tag }}

      - name: Configure public Azure ingress
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || env.AZURE_RESOURCE_GROUP || secrets.AZURE_RESOURCE_GROUP }}
          AZURE_CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP || env.AZURE_CONTAINER_APP || secrets.AZURE_CONTAINER_APP }}
        run: |
          set -euo pipefail
          az containerapp ingress enable \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "${AZURE_CONTAINER_APP}" \
            --type external \
            --target-port 8000 \
            --transport auto \
            --only-show-errors
          az containerapp ingress traffic set \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "${AZURE_CONTAINER_APP}" \
            --revision-weight latest=100 \
            --only-show-errors

      - name: Resolve Azure Container App URL
        id: resolve-azure-url
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || env.AZURE_RESOURCE_GROUP || secrets.AZURE_RESOURCE_GROUP }}
          AZURE_CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP || env.AZURE_CONTAINER_APP || secrets.AZURE_CONTAINER_APP }}
        run: |
          set -euo pipefail
          fqdn="$(az containerapp show \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "${AZURE_CONTAINER_APP}" \
            --query properties.configuration.ingress.fqdn \
            --output tsv \
            --only-show-errors)"
          test -n "${fqdn}" || { echo "[ERROR] Azure Container App FQDN is empty"; exit 1; }
          url="https://${fqdn}"
          echo "url=${url}" >> "${GITHUB_OUTPUT}"
          echo "[OK] Azure Container App public URL resolved."

      - name: Verify Azure Container App Health
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request

          url = os.environ["AZURE_CONTAINER_APP_URL"].rstrip("/") + "/health"
          for attempt in range(1, 7):
              try:
                  with urllib.request.urlopen(url, timeout=15) as response:
                      payload = json.loads(response.read().decode("utf-8"))
                  if response.status == 200 and payload.get("status") in {"ok", "healthy", "running", "alive", "up"}:
                      print(f"[OK] Azure Container App health check passed on attempt {attempt}")
                      raise SystemExit(0)
                  print(f"[WARNING] Health payload not ready on attempt {attempt}: {payload}")
              except Exception as error:
                  print(f"[WARNING] Health check attempt {attempt} failed: {error}")
              time.sleep(10)
          print("[ERROR] Azure Container App health check failed")
          raise SystemExit(1)
          PY
        env:
          AZURE_CONTAINER_APP_URL: ${{ steps.resolve-azure-url.outputs.url }}

      - name: Azure Logout
        if: always()
        run: az logout || true

  hermes-post-deploy:
    name: Hermes Headless — Post-Deploy E2E Verification
    runs-on: ubuntu-latest
    needs: deploy-azure
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Doppler Secret Sync (1st Priority)
        uses: dopplerhq/secrets-fetch-action@v1.2.0
        continue-on-error: true
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
        id: doppler

      - name: Install Dependencies
        run: |
          pip install httpx python-dotenv rich typer

      - name: Run strict production path verification
        env:
          AZURE_CONTAINER_APP_URL: ${{ needs.deploy-azure.outputs.azure_container_app_url || vars.AZURE_CONTAINER_APP_URL || env.AZURE_CONTAINER_APP_URL || secrets.AZURE_CONTAINER_APP_URL }}
          HF_BACKEND_URL: ${{ needs.deploy-azure.outputs.azure_container_app_url || vars.AZURE_CONTAINER_APP_URL || env.AZURE_CONTAINER_APP_URL || secrets.AZURE_CONTAINER_APP_URL }}
          VERCEL_GATEWAY_URL: ${{ vars.VERCEL_GATEWAY_URL || 'https://horo-consultant-psi.vercel.app' }}
          HF_STATIC_CDN_URL: ${{ vars.HF_STATIC_CDN_URL || 'https://pphothidaen-horoconsultant-core-backend.static.hf.space' }}
        run: |
          python3 scripts/run_live_health_verification.py --json-output production-verification.json

      - name: Run production synthetic monitor
        env:
          AZURE_CONTAINER_APP_URL: ${{ needs.deploy-azure.outputs.azure_container_app_url || vars.AZURE_CONTAINER_APP_URL || env.AZURE_CONTAINER_APP_URL || secrets.AZURE_CONTAINER_APP_URL }}
          HF_BACKEND_URL: ${{ needs.deploy-azure.outputs.azure_container_app_url || vars.AZURE_CONTAINER_APP_URL || env.AZURE_CONTAINER_APP_URL || secrets.AZURE_CONTAINER_APP_URL }}
          VERCEL_GATEWAY_URL: ${{ vars.VERCEL_GATEWAY_URL || 'https://horo-consultant-psi.vercel.app' }}
          HF_STATIC_CDN_URL: ${{ vars.HF_STATIC_CDN_URL || 'https://pphothidaen-horoconsultant-core-backend.static.hf.space' }}
        run: |
          python3 scripts/synthetic_health_monitor.py --once --json-output synthetic-health.json

      - name: Upload production verification reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-verification-${{ github.sha }}
          path: |
            production-verification.json
            synthetic-health.json
          if-no-files-found: warn
