name: Workers Hermes

on:
  push:
    branches: [main]
    paths:
      - "wrangler.hermes.toml"
      - "api/index.js"
      - "project/routers/**"
  pull_request:
    branches: [main]
    paths:
      - "wrangler.hermes.toml"
      - "api/index.js"
      - "project/routers/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

jobs:
  workers-deploy-hermes:
    name: Deploy Hermes Workers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Validate configuration
        continue-on-error: true
        run: |
          if [ ! -f wrangler.hermes.toml ]; then
            echo "::error::wrangler.hermes.toml not found"
            exit 1
          fi
          npx wrangler whoami --config wrangler.hermes.toml

      - name: Dry-run deploy
        continue-on-error: true
        run: npx wrangler deploy --dry-run --config wrangler.hermes.toml

      - name: Deploy to Workers
        if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'production'
        run: npx wrangler deploy --config wrangler.hermes.toml --outdir /tmp/wrangler-deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN_HERMES }}