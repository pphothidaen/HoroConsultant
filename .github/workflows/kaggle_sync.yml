name: Kaggle Output Sync Workflow

on:
  workflow_dispatch:

jobs:
  kaggle-sync:
    name: Sync Kaggle Kernel Outputs & Logs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies & Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          pip install kaggle python-dotenv requests pydantic

      - name: Configure Kaggle Credentials
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_TOKEN: ${{ secrets.KAGGLE_TOKEN || secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle
          echo "{\"username\":\"${KAGGLE_USERNAME:-pphothidaen}\",\"key\":\"${KAGGLE_TOKEN}\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Pull Kaggle Kernel Outputs & Logs
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_TOKEN: ${{ secrets.KAGGLE_TOKEN || secrets.KAGGLE_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 scripts/kaggle_notebook_manager.py --output --dest project/kaggle_kernel

      - name: Commit and Push pulled outputs back to GitHub
        run: |
          git config --global user.name "HoroConsultant-Bot"
          git config --global user.email "bot@horoconsultant.local"
          git add project/kaggle_kernel/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(kaggle): sync kernel output logs from Kaggle" && git push origin main)
