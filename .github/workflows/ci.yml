name: Unified CI & Quality Audit Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  pytest-suite:
    name: PyTest & Edge Boundary Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          grep -vE "mlx|mlx-lm|mlx-metal" requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt

      - name: Run Pytest Test Suite
        run: |
          python3 -m pytest -v

  lint-and-security:
    name: Code Quality & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Audit Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit httpx pydantic

      - name: Run Ruff Linter
        run: |
          ruff check project/ tests/ --exit-zero

      - name: Run Security Audit (Bandit)
        run: |
          bandit -r project/ -s B101,B404,B603,B311,B324,B110 -ll --exit-zero

      - name: Run Project Code Reviewer
        run: |
          python3 project/core/code_reviewer.py --review

  rust-core-audit:
    name: Rust PyO3 High-Performance Math Core Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build and Check Rust Core
        run: |
          cd rust_core
          cargo check --release
          cargo test --release

