name: Unified CI & Quality Audit Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    # Daily config drift detection (M11) - runs at 06:00 UTC
    - cron: "0 6 * * *"
    # Quarterly secret rotation trigger (M6) - runs on 1st day of every quarter at 06:00 UTC
    - cron: "0 6 1 */3 *"

jobs:
  classify-changes:
    name: Classify Change Tier (Path-Based Ruleset)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tier: ${{ steps.classifier.outputs.tier }}
      has_source_changes: ${{ steps.classifier.outputs.has_source_changes }}
      run_rust_audit: ${{ steps.classifier.outputs.run_rust_audit }}
      run_heavy_pytest: ${{ steps.classifier.outputs.run_heavy_pytest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Classify paths
        id: classifier
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 scripts/path_ruleset_classifier.py \
              --base "origin/${{ github.base_ref }}" \
              --head "HEAD" \
              --github-output
          else
            echo "tier=STRICT" >> "$GITHUB_OUTPUT"
            echo "has_source_changes=true" >> "$GITHUB_OUTPUT"
            echo "run_rust_audit=true" >> "$GITHUB_OUTPUT"
            echo "run_heavy_pytest=true" >> "$GITHUB_OUTPUT"
            echo "affected_test_globs=" >> "$GITHUB_OUTPUT"
          fi

  pytest-targeted:
    name: Targeted PyTest (TIER_MEDIUM)
    needs: classify-changes
    if: github.event_name == 'pull_request' && needs.classify-changes.outputs.tier == 'MEDIUM'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HORO_ALLOW_PYTHON_FALLBACK: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Run Targeted Tests
        run: |
          GLOBS="${{ needs.classify-changes.outputs.affected_test_globs }}"
          if [ -z "$GLOBS" ]; then
            echo "No test globs provided, skipping."
            exit 0
          fi
          # Expand globs to file paths
          FILES=""
          for glob in $GLOBS; do
            MATCHED=$(find . -path "$glob" -type f)
            if [ -n "$MATCHED" ]; then
              FILES="$FILES $MATCHED"
            fi
          done
          if [ -z "$FILES" ]; then
            echo "No test files matched globs: $GLOBS"
            exit 0
          fi
          echo "Running targeted tests: $FILES"
          python3 -m pytest $FILES -v -m "not network"

  ai-code-generation:
    name: AI Code/Test Generation (KAN-305)
    needs: classify-changes
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Detect AI generation trigger
        id: ai-trigger
        run: |
          # Check if PR has ai-generate label or new feature files
          PR_NUMBER="${{ github.event.pull_request.number }}"
          if [ -z "$PR_NUMBER" ]; then
            echo "triggered=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          # Get PR labels via GitHub CLI
          LABELS=$(gh pr view "$PR_NUMBER" --json labels -q '.labels[].name' 2>/dev/null || echo "")
          
          if echo "$LABELS" | grep -q "ai-generate"; then
            echo "triggered=true" >> "$GITHUB_OUTPUT"
          else
            echo "triggered=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate AI code for new features
        if: steps.ai-trigger.outputs.triggered == 'true'
        run: |
          echo "AI code generation triggered for PR #${{ github.event.pull_request.number }}"
          # This step would invoke AI coding assistant (Cursor/Copilot)
          # For now, we simulate by creating a marker file
          mkdir -p .ai-generated
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .ai-generated/generation.timestamp
          echo "PR #${{ github.event.pull_request.number }}" > .ai-generated/pr-number.txt
          
          # In production, this would call:
          # - Cursor CLI with --generate flag
          # - GitHub Copilot API
          # - Custom AI agent for code generation

      - name: Generate AI tests for new functions
        if: steps.ai-trigger.outputs.triggered == 'true'
        run: |
          echo "AI test generation triggered"
          # This would generate unit tests for new functions/classes
          # For now, create marker
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .ai-generated/test_generation.timestamp

      - name: Commit AI-generated changes
        if: steps.ai-trigger.outputs.triggered == 'true'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "AI-Generated: code and tests for PR #${{ github.event.pull_request.number }}
            
            This commit contains AI-generated code and tests.
            ai-generated
            ai-review-required"
            git push origin HEAD:${{ github.head_ref }}
          else
            echo "No AI-generated changes to commit"
          fi

  ai-review-enforcement:
    name: AI Review Enforcement (KAN-305)
    needs: [classify-changes]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Get PR body and labels
        id: pr-info
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          BODY=$(gh pr view "$PR_NUMBER" --json body -q '.body' 2>/dev/null || echo "")
          LABELS=$(gh pr view "$PR_NUMBER" --json labels -q '.labels[].name' 2>/dev/null | tr '\n' ',' | sed 's/,$//' || echo "")
          # Escape for GitHub Actions output
          BODY="${BODY//'%'/'%25'}"
          BODY="${BODY//$'\n'/'%0A'}"
          BODY="${BODY//$'\r'/'%0D'}"
          echo "body=$BODY" >> "$GITHUB_OUTPUT"
          echo "labels=$LABELS" >> "$GITHUB_OUTPUT"

      - name: Run AI detection and review check
        run: |
          python3 scripts/detect_ai_generated.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --pr-body "${{ steps.pr-info.outputs.body }}" \
            --pr-labels "${{ steps.pr-info.outputs.labels }}" \
            --repo "." \
            --json-out ai-review-report.json

      - name: Upload AI review report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-review-report
          path: ai-review-report.json
          if-no-files-found: warn

  pytest-suite:
    name: PyTest & Edge Boundary Testing
    needs: [rust-core-audit, classify-changes, artifact-integrity-tests, ai-review-enforcement]
    if: github.event_name != 'pull_request' || needs.classify-changes.outputs.run_heavy_pytest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HORO_ALLOW_PYTHON_FALLBACK: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Download the audited Linux Rust wheel
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.1.11
        with:
          name: rust-core-wheel
          path: wheelhouse

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
          pip install --force-reinstall --no-deps wheelhouse/*.whl
          python - <<'PY'
          import os
          import pathlib
          import shutil

          os.chdir("/tmp")
          import rust_core

          native_origin = pathlib.Path(rust_core.__native_origin__)
          workspace = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          target = workspace / "rust_core" / native_origin.name
          shutil.copy2(native_origin, target)
          package_dir = native_origin.parent
          for libs_dir in (package_dir.parent / "rust_core.libs", package_dir / ".libs"):
              if libs_dir.is_dir():
                  libs_target = workspace / libs_dir.name
                  if libs_target.exists():
                      shutil.rmtree(libs_target)
                  shutil.copytree(libs_dir, libs_target)
                  print(f"Copied installed Rust shared libraries to {libs_target}")
          print(f"Copied installed Rust extension artifact from {native_origin} to {target}")
          PY

      - name: Run Pytest Test Suite
        run: |
          python3 -m pytest -v -m "not network"

      - name: Generate OpenAPI snapshot & verify Rust↔Python route sync
        run: |
          python3 -c "
          import json
          from project.main import app
          with open('/tmp/oa.json', 'w') as f:
              json.dump(app.openapi(), f)
          print('OpenAPI snapshot generated with', len(app.openapi()['paths']), 'paths')
          "
          python3 -m pytest tests/test_route_sync.py -v -m contract

      - name: Run LuoPan & Metaphysics Dynamic Regression Tests
        run: |
          python3 -m pytest project/tests/test_luopan_dynamic_variance_regression.py project/tests/test_luopan_dream_engine.py -v

      - name: Run Project Code Reviewer
        run: |
          python3 project/core/code_reviewer.py --review --use-python --skip-tests

  e2e-production-audit:
    name: Live Production Version & LuoPan E2E Regression
    needs: [classify-changes, artifact-integrity-tests]
    if: github.event_name != 'pull_request' || needs.classify-changes.outputs.has_source_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HORO_ALLOW_PYTHON_FALLBACK: "1"
      PYTHONPATH: "."
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          grep -vE "mlx|mlx-lm|mlx-metal" requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt pytest

      - name: Run Production Version E2E Regression
        # Candidate identity can only be required after main has deployed it.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python3 scripts/run_prod_version_e2e.py

      - name: Run LuoPan Dynamic Variance E2E Regression
        run: |
          python3 scripts/run_luopan_e2e_regression.py

      - name: Run Cloud Architecture Overview (Full Stack) Regression
        run: |
          python3 scripts/run_cloud_architecture_regression.py

      - name: Run GitHub Actions Workflows Full Regression
        run: |
          python3 scripts/run_github_actions_regression.py


      - name: Upload E2E Regression Reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: e2e-regression-reports
          path: |
            project/tests/prod_version_regression_report.json
            project/tests/luopan_e2e_regression_report.json
          if-no-files-found: warn

  lint-and-security:
    name: Code Quality & Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.4.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Audit Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit httpx pydantic

      - name: Run Ruff Linter
        run: |
          # Ratchet runtime-breaking findings first; legacy style debt remains tracked.
          ruff check project/ tests/ --select E9,F63,F7,F82 --exclude project/kaggle_kernel

      - name: Run Security Audit (Bandit)
        run: |
          bandit -r project/ scripts/ -x project/kaggle_kernel -s B101,B404,B603,B311,B324,B110 -lll

  rust-core-audit:
    name: Rust PyO3 High-Performance Math Core Audit
    needs: classify-changes
    if: github.event_name != 'pull_request' || needs.classify-changes.outputs.run_rust_audit == 'true' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable-branch
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - name: Build and Check Rust Core
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin==1.14.1 numpy pytest
          cd rust_core
          cargo fmt --all -- --check
          cargo clippy --no-default-features --features server --all-targets -- -D warnings
          cargo test --no-default-features --test test_runtime_contract --test test_vector_search
          cargo test --no-default-features --features server --all-targets
          if cargo tree --no-default-features --features server -e normal | grep -q pyo3; then
            echo "[ERROR] server feature unexpectedly depends on PyO3"
            exit 1
          fi
          maturin build --release --features python-extension,server --bindings pyo3 --out wheelhouse
          python -m pip install --force-reinstall --no-deps wheelhouse/*.whl
          HORO_PROJECT_ROOT="$GITHUB_WORKSPACE" python tests/test_installed_wheel.py -v
          # Copy wheel to workspace root for artifact upload
          cp wheelhouse/*.whl "$GITHUB_WORKSPACE/"

      - name: Upload the audited Linux wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-core-wheel
          path: "*.whl"
          if-no-files-found: error

  artifact-integrity-tests:
    name: Artifact Integrity Tests (SHA256)
    needs: [rust-core-audit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HORO_ALLOW_PYTHON_FALLBACK: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Download the audited Linux Rust wheel
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.1.11
        with:
          name: rust-core-wheel
          path: .

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
          pip install --force-reinstall --no-deps *.whl

      - name: Generate OpenAPI snapshot
        run: |
          python3 -c "
          import json
          from project.main import app
          with open('openapi.json', 'w') as f:
              json.dump(app.openapi(), f)
          print('OpenAPI snapshot generated with', len(app.openapi()['paths']), 'paths')
          "

      - name: Verify test-provenance exists
        run: |
          if [ ! -f provenance.json ]; then
            echo "provenance.json not found, creating minimal one"
            echo '{"schema_version": "test-provenance-v1", "ticket_id": "KAN-300", "test_files": []}' > provenance.json
          fi

      - name: Generate artifact hashes
        run: |
          npx tsx src/artifacts/integrity.ts generate \
            ./*.whl \
            provenance.json \
            openapi.json > artifact-hashes.json
          cat artifact-hashes.json

      - name: Upload artifact hashes manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: artifact-hashes
          path: artifact-hashes.json
          retention-days: 30
          if-no-files-found: error

      - name: Verify artifact integrity
        run: |
          npx tsx src/artifacts/integrity.ts verify artifact-hashes.json \
            wheelhouse/*.whl \
            provenance.json \
            openapi.json

  test-provenance:
    name: Test Provenance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write  # Required for keyless cosign signing with GitHub OIDC
    steps:
      - name: Checkout full Git history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install cosign (M2/M10 provenance)
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 # v3.5.0
        with:
          cosign-release: "v2.2.4"

      - name: Post-squash-merge version restamp
        run: |
          python3 scripts/stamp_version.py --post-squash-merge

      - name: Sign version.json with cosign (keyless via GitHub OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          # Fetch GitHub OIDC token for sigstore audience
          ID_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sigstore" | jq -r .value)
          cosign sign-blob --yes \
            --identity-token "$ID_TOKEN" \
            --output-signature project/static/version.json.sig \
            project/static/version.json

      - name: Upload version.json + signature (M2/M10)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: version-json-signed
          path: |
            project/static/version.json
            project/static/version.json.sig
          if-no-files-found: error

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Resolve immutable comparison base
        id: provenance-comparison
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git fetch --no-tags origin "$BASE_REF"
            base_commit="$(git merge-base HEAD "origin/$BASE_REF")"
          elif [[ -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            base_commit="$BEFORE_SHA"
          else
            base_commit="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "${base_commit}^{commit}"
          echo "base_commit=$base_commit" >> "$GITHUB_OUTPUT"

      - name: Verify test-first Git provenance
        run: |
          python3 scripts/test_provenance_guard.py verify-pr \
            --base "${{ steps.provenance-comparison.outputs.base_commit }}" \
            --head HEAD \
            --branch "${{ github.head_ref || github.ref_name }}" \
            --post-squash-merge \
            --json-out test-provenance-report.json

      - name: Upload provenance report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-provenance-report
          path: test-provenance-report.json
          if-no-files-found: error

  config-drift-detection:
    name: Config Drift Detection (M11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Compute current config hashes (M11)
        id: current-hashes
        run: |
          set -euo pipefail
          configs=(
            ".github/workflows/ci.yml"
            ".github/workflows/deploy-render.yml"
            ".github/workflows/test_provenance.yml"
            ".github/workflows/production_monitor.yml"
            ".github/workflows/gitbook-webhook-pr.yml"
            ".github/dependabot.yml"
            "Dockerfile.render"
            "render.yaml"
            "wrangler.toml"
            "wrangler.jsonc"
          )
          echo "config_hashes<<EOF" >> "$GITHUB_OUTPUT"
          for f in "${configs[@]}"; do
            if [[ -f "$f" ]]; then
              sha=$(sha256sum "$f" | awk '{print $1}')
              echo "$f:$sha"
            else
              echo "$f:MISSING"
            fi
          done
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Load baseline hashes (M11)
        id: baseline-hashes
        run: |
          set -euo pipefail
          baseline_file=".github/config-baseline.json"
          if [[ -f "$baseline_file" ]]; then
            cat "$baseline_file" >> "$GITHUB_OUTPUT"
          else
            echo "baseline_hashes={}" >> "$GITHUB_OUTPUT"
            echo "::warning::No baseline file found at $baseline_file — creating from current state"
          fi

      - name: Compare hashes and detect drift (M11)
        env:
          CURRENT: ${{ steps.current-hashes.outputs.config_hashes }}
          BASELINE: ${{ steps.baseline-hashes.outputs.baseline_hashes }}
        run: |
          set -euo pipefail
          echo "=== Config Drift Report ==="
          echo "Current hashes:"
          echo "$CURRENT"
          echo ""
          echo "Baseline hashes:"
          echo "$BASELINE"
          echo ""

          drift_found=false
          while IFS= read -r line; do
            if [[ -n "$line" && "$line" != "config_hashes<<EOF" && "$line" != "EOF" ]]; then
              file=${line%%:*}
              curr_sha=${line#*:}
              base_line=$(echo "$BASELINE" | grep "^${file}:" || echo "${file}:MISSING")
              base_sha=${base_line#*:}
              if [[ "$curr_sha" != "$base_sha" ]]; then
                echo "::error file=${file}::DRIFT DETECTED: current=${curr_sha} baseline=${base_sha}"
                drift_found=true
              else
                echo "OK: ${file}"
              fi
            fi
          done <<< "$CURRENT"

          if [[ "$drift_found" == "true" ]]; then
            echo "::error::Config drift detected — see above for details"
            exit 1
          fi
          echo "No config drift detected."

      - name: Update baseline on main push (M11)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          echo "${{ steps.current-hashes.outputs.config_hashes }}" > .github/config-baseline.json
          echo "Baseline updated from main push."

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: config-drift-report
          path: |
            .github/config-baseline.json
          if-no-files-found: warn

