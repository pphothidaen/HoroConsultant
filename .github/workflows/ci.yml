name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Pytest Suite
    runs-on: ubuntu-latest

    env:
      AUTO_SYNC_ENABLED: "false"
      GOOGLE_AI_STUDIO_API_KEY: "dummy_key_for_ci"
      OLLAMA_BASE_URL: "http://localhost:11434"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Filter out macOS Apple Silicon specific packages (mlx, mlx-lm, mlx-metal) for Linux runner
          grep -vE "mlx|mlx-lm|mlx-metal" requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt

      - name: Run pytest with coverage
        run: |
          python3 -m pytest -v --cov=project --cov-report=xml --junitxml=test-results.xml

      - name: Upload test results artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results
          path: |
            test-results.xml
            coverage.xml

