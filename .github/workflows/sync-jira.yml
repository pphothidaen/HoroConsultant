name: Sync ATOMIC-TICKET <-> Jira

# Bidirectional sync: ATOMIC_TICKET.md <-> Jira Issues (KAN project)
# Direct Jira Cloud REST via scripts/sync_jira_to_atomic.py (basic auth:
# JIRA_EMAIL + JIRA_API_TOKEN, site via JIRA_BASE_URL).
# Jira Plans auto-sync via parent hierarchy + fixVersion

on:
  push:
    paths:
      - 'ATOMIC_TICKET.md'
      - 'docs/jira/remaining_subtasks_bulk.json'
  # Jira → File sync จัดการโดย Jira Automation webhook (ไม่ใช่ GitHub Actions event)
  # ดู: docs/jira_sync_protocol.md → "Jira to ATOMIC_TICKET.md" section
  schedule:
    - cron: '0 0 * * 1'  # Weekly backup sync

jobs:
  sync-to-jira:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync remaining sub-tasks to Jira
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
        run: |
          python3 scripts/sync_jira_to_atomic.py \
            --jql "project = KAN AND parent = KAN-38" \
            --out /tmp/subtasks.json
          echo "Found $(jq '.issues | length' /tmp/subtasks.json) remaining sub-tasks"

  sync-from-jira:
    # KAN-264 NOTE: This job is inert — github.event_name == 'jira' never fires
    # on this repository (Jira Automation webhook handles Jira→File sync, see
    # docs/jira_sync_protocol.md). Kept for structural parity with the original
    # workflow; no TWG CLI, no secrets consumed.
    if: github.event_name == 'jira'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync Jira status to ATOMIC_TICKET
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
        run: |
          python3 scripts/sync_jira_to_atomic.py \
            --jql "project = KAN AND status = Done AND updated >= -1h" \
            --out /tmp/jira_done.json
          echo "Synced $(jq '.issues | length' /tmp/jira_done.json) completed items"