name: Test Provenance

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-provenance:
    name: Test Provenance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve immutable comparison base
        id: comparison
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git fetch --no-tags origin "$BASE_REF"
            base_commit="$(git merge-base HEAD "origin/$BASE_REF")"
          elif [[ -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            base_commit="$BEFORE_SHA"
          else
            base_commit="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "${base_commit}^{commit}"
          echo "base_commit=$base_commit" >> "$GITHUB_OUTPUT"

      - name: Verify test-first Git provenance
        run: >-
          python3 scripts/test_provenance_guard.py verify-pr
          --base "${{ steps.comparison.outputs.base_commit }}"
          --head HEAD
          --json-out test-provenance-report.json

      - name: Upload provenance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-provenance-report
          path: test-provenance-report.json
          if-no-files-found: error
