name: Test Provenance

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-provenance:
    name: Test Provenance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full Git history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Post-squash-merge version restamp
        run: |
          python3 scripts/stamp_version.py --post-squash-merge

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Resolve immutable comparison base
        id: comparison
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git fetch --no-tags origin "$BASE_REF"
            base_commit="$(git merge-base HEAD "origin/$BASE_REF")"
          elif [[ -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            base_commit="$BEFORE_SHA"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            # For workflow_dispatch, compare against main
            git fetch --no-tags origin main
            base_commit="$(git merge-base HEAD origin/main)"
          else
            base_commit="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "${base_commit}^{commit}"
          echo "base_commit=$base_commit" >> "$GITHUB_OUTPUT"

      - name: Verify test-first Git provenance
        run: >-
          python3 scripts/test_provenance_guard.py verify-pr
          --base "${{ steps.comparison.outputs.base_commit }}"
          --head HEAD
          --branch "${{ github.head_ref || github.ref_name }}"
          ${{ github.event_name == 'push' && '--post-squash-merge' || '' }}
          --json-out test-provenance-report.json

      - name: Upload provenance report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-provenance-report
          path: test-provenance-report.json
          if-no-files-found: error
          retention-days: 30
