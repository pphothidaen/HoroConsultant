name: Workers Builds

on:
  push:
    branches: [main]
    paths:
      - "wrangler.toml"
      - "wrangler.hermes.toml"
      - "project/static/_worker.js"
      - "project/routers/**"
  pull_request:
    branches: [main]
    paths:
      - "wrangler.toml"
      - "wrangler.hermes.toml"
      - "project/static/_worker.js"
      - "project/routers/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

jobs:
  workers-build:
    name: Workers Builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Validate configuration
        continue-on-error: true
        run: |
          if [ ! -f wrangler.toml ]; then
            echo "::error::wrangler.toml not found"
            exit 1
          fi
          npx wrangler whoami

      - name: Dry-run deploy
        # KAN-269: no continue-on-error. A dry-run that silently fails hides a
        # broken config, which is how the entry-point drift went unnoticed.
        run: npx wrangler deploy --dry-run --env production

      - name: Deploy to Workers
        if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'production'
        # Wrangler v4 only reads CLOUDFLARE_API_TOKEN (not CF_API_TOKEN); the
        # step must fail the job when the deploy fails.
        #
        # KAN-269: use secrets.CF_API_TOKEN — that token belongs to the account
        # that OWNS this Worker (bda49e4e77e00609cb1ef68561b0d9eb). The previous
        # Hermes-scoped token pointed at a different account and could never
        # deploy this Worker (API 10007 "This Worker does not exist").
        run: npx wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
