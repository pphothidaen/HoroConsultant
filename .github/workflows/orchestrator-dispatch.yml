name: Orchestrator Dispatch — Jira → Subagent

# Polls Jira KAN project for new "Ready" tickets every 5 minutes.
# Uses Fibonacci backoff when idle: 1,1,2,3,5,8,13 min.
# When a new ticket is found: creates branch, dispatches subagent, monitors.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: orchestrator-dispatch
  cancel-in-progress: true

env:
  JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
  JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
  JIRA_PROJECT_KEY: 'KAN'
  # JIRA_ACCESS_TOKEN is set per-step below: the `steps` context is not
  # available at workflow level, and referencing it here made the workflow
  # unparseable ("Unrecognized named-value: 'steps'").
  JIRA_CLIENT_ID: ${{ secrets.JIRA_CLIENT_ID }}
  JIRA_CLIENT_SECRET: ${{ secrets.JIRA_CLIENT_SECRET }}
  JIRA_REFRESH_TOKEN: ${{ secrets.JIRA_REFRESH_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  ORCHESTRATOR_LANE: 'Horo Consultant'

jobs:
  poll-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      dispatched: ${{ steps.dispatch.outputs.dispatched }}
      ticket_key: ${{ steps.dispatch.outputs.ticket_key }}
      branch_name: ${{ steps.dispatch.outputs.branch_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Atlassian forces rotating refresh tokens, so the access token cannot
      # be a static secret. Refresh it here and persist the rotated
      # refresh_token so the next scheduled run starts from a live credential.
      - name: Refresh Jira access token
        id: jira-token
        env:
          # Atlassian rotates the refresh token on every grant, and the rotated
          # value must be written back to JIRA_REFRESH_TOKEN for the next run.
          # GITHUB_TOKEN cannot call the actions/secrets API, so persistence
          # uses the fine-grained PAT scoped to Secrets: write on this repo.
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
        run: |
          ACCESS_TOKEN=$(python3 scripts/refresh_jira_token.py)
          echo "::notice::token refresh exit=$?"
          echo "access_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"

      # Direct Jira Cloud REST rather than the Teamwork Graph CLI: the CLI's
      # OAuth scopes (:twg-cli / :twg) are not grantable through the developer
      # console, and `twg login` is an interactive device flow that cannot run
      # on a CI runner. read:jira-work covers this read-only JQL query.
      - name: Poll Jira for Ready tickets
        id: poll
        env:
          # A 3LO bearer token is only accepted through the OAuth gateway,
          # not the site hostname, so resolve the cloud id per run and build
          # the gateway base URL from it.
          JIRA_ACCESS_TOKEN: ${{ steps.jira-token.outputs.access_token }}
          JQL: >-
            project = KAN AND status = "Ready"
            AND "Project Lane" = "Horo Consultant"
            ORDER BY created ASC
        run: |
          CLOUD_ID=$(curl -sf -H "Authorization: Bearer $JIRA_ACCESS_TOKEN" \
            https://api.atlassian.com/oauth/token/accessible-resources | jq -r '.[0].id')
          GATEWAY_URL="https://api.atlassian.com/ex/jira/$CLOUD_ID"
          python3 scripts/jira_query.py --jql "$JQL" --base-url "$GATEWAY_URL" > /tmp/jira_ready.json
          COUNT=$(jq '.issues | length' /tmp/jira_ready.json)
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          if [ "$COUNT" -gt 0 ]; then
            KEY=$(jq -r '.issues[0].key' /tmp/jira_ready.json)
            SUMMARY=$(jq -r '.issues[0].fields.summary' /tmp/jira_ready.json)
            echo "key=$KEY" >> $GITHUB_OUTPUT
            echo "summary=$SUMMARY" >> $GITHUB_OUTPUT
          fi

      - name: Create branch
        id: branch
        if: steps.poll.outputs.count > 0
        run: |
          KEY="${{ steps.poll.outputs.key }}"
          BRANCH="release/auto-$(date +%Y%m%d)-${KEY}"
          git checkout -b "$BRANCH"
          echo "name=$BRANCH" >> $GITHUB_OUTPUT

      - name: Push branch
        if: steps.poll.outputs.count > 0
        run: |
          git push -u origin "${{ steps.branch.outputs.name }}"

      - name: Dispatch result
        id: dispatch
        if: steps.poll.outputs.count > 0
        run: |
          echo "dispatched=true" >> $GITHUB_OUTPUT
          echo "ticket_key=${{ steps.poll.outputs.key }}" >> $GITHUB_OUTPUT
          echo "branch_name=${{ steps.branch.outputs.name }}" >> $GITHUB_OUTPUT
          echo "::notice::Ticket ${{ steps.poll.outputs.key }} dispatched to branch ${{ steps.branch.outputs.name }}"
