name: "[RETIRED] Hugging Face Docker Backend Deployment"

# Audit-only tombstone. The job is statically disabled and receives no
# credentials. Git history remains the recovery source for the retired lane.
on:
  workflow_dispatch:

permissions: {}

jobs:
  retired:
    name: Hugging Face backend deployment is permanently retired
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Retirement notice
        run: |
          echo "::error::Hugging Face Space backend is permanently retired in favor of Render primary backend."
          exit 1
