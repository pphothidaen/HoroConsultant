name: "[RETIRED] Fly.io Deployment"

# Audit-only tombstone. The job is statically disabled and receives no
# credentials. Git history remains the recovery source for the retired lane.
on:
  workflow_dispatch:

permissions: {}

jobs:
  retired:
    name: Fly.io deployment is permanently retired
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Retirement notice
        run: |
          echo "::error::Fly.io is not an approved HoroConsultant deployment target."
          exit 1
