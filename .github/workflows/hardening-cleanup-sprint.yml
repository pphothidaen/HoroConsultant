name: Hardening/Cleanup Sprint

on:
  schedule:
    - cron: '0 0 1 * *'
      # Runs on the 1st day of every month at 00:00 UTC
  workflow_dispatch:

jobs:
  hardening-cleanup-sprint:
    runs-on: ubuntu-latest
    env:
      HORO_ALLOW_PYTHON_FALLBACK: "1"
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install radon bandit

      - name: Run Code Reviewer in Observation Mode
        id: code_review
        run: |
          python3 project/core/code_reviewer.py --review --use-python --skip-tests > code_review_report.json
          echo "report-path=code_review_report.json" >> $GITHUB_OUTPUT

      - name: Run auto_intent_generator --dry-run
        run: |
          python scripts/auto_intent_generator.py --report code_review_report.json --dry-run

      - name: Generate Hardening/Cleanup Sprint Report
        run: |
          python3 -c '\nimport json\n\nwith open("code_review_report.json") as f:\n    report = json.load(f)\n\nsummary = report.get("overall_status", "UNKNOWN")\nfindings = report.get("secret_scan", {}).get("secret_leaks_found", 0)\nstop_conditions = report.get("stop_conditions", [])\n\nwith open("HARDENING_CLEANUP_SPRINT_REPORT.md", "w") as out:\n    out.write("# Hardening/Cleanup Sprint Report\\n\\n")\n    out.write(f"- **Overall Status**: {summary}\\n")\n    out.write(f"- **Secret Leaks Found**: {findings}\\n")\n    out.write(f"- **Stop Conditions**: {len(stop_conditions)}\\n")\n    if stop_conditions:\n        out.write("\\n**Stop Conditions Detail**:\\n")\n        for sc in stop_conditions:\n            out.write(f"- {sc}\\n")\n    out.write("\\n---\\n\\nGenerated on: ") + __import__("datetime").datetime.now().isoformat() + "\\n")\n'

      - name: Create GitHub Issue with Findings
        uses: peter-evans/create-issue-from-body@4931
        with:
          title: "Hardening/Cleanup Sprint - ${{ github.run_date }}"
          branch: "hardening-cleanup-sprint/${{ github.run_number }}"
          delete-head-branch: true
          labels: ["hardening", "cleanup", "sprint"]
          body: |
            ## Hardening/Cleanup Sprint Report
            
            ## Summary
            - Overall Status: code_review_report.json
            - Secret Leaks Found: See report
            - Stop Conditions: Auto-generated
            
            ## Report Details
            The full code reviewer report is available as `code_review_report.json`.
            
            ---
            
            *Generated by Hardening/Cleanup Sprint (monthly cadence)*