name: Workflow Auto-Disable Policy

# KAN-95: Auto-disable workflows after N=5 consecutive failures and create Jira ticket

on:
  workflow_run:
    workflows:
      - "Orchestrator Dispatch — Jira → Subagent"
      - "Production Synthetic Monitoring"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: workflow-auto-disable
  cancel-in-progress: true

jobs:
  check-and-disable:
    name: Check consecutive failures and auto-disable if N=5
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'schedule'

    steps:
      - uses: actions/checkout@v4

      - name: Count recent consecutive failures
        id: count
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const workflowId = run.workflow_id;
            const branch = run.head_branch || 'main';

            const response = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflowId,
              branch: branch,
              status: 'failure',
              event: 'schedule',
              per_page: 10,
            });

            let consecutive = 0;
            for (const r of response.data.workflow_runs) {
              if (r.conclusion === 'failure') {
                consecutive++;
              } else {
                break;
              }
            }

            console.log('Consecutive failures for workflow ' + workflowId + ' (' + branch + '): ' + consecutive);
            core.setOutput('consecutive', consecutive);
            core.setOutput('workflow_id', workflowId);
            core.setOutput('workflow_name', run.name);

      - name: Disable workflow if N=5 consecutive failures
        if: steps.count.outputs.consecutive >= 5
        uses: actions/github-script@v7
        with:
          script: |
            const workflowId = parseInt('${{ steps.count.outputs.workflow_id }}');
            const consecutive = parseInt('${{ steps.count.outputs.consecutive }}');
            const workflowName = '${{ steps.count.outputs.workflow_name }}';
            const runUrl = context.payload.workflow_run.html_url;

            await github.rest.actions.disableWorkflow({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflowId,
            });

            console.log('[AUTO-DISABLED] Workflow "' + workflowName + '" disabled after ' + consecutive + ' consecutive failures.');
            console.log('Run URL: ' + runUrl);

            const issueTitle = '[AUTO-DISABLED] ' + workflowName + ' disabled after ' + consecutive + ' consecutive failures';
            const issueBody = '## Workflow Auto-Disable Policy Triggered\n\n' +
              '- **Workflow:** ' + workflowName + '\n' +
              '- **Run:** ' + runUrl + '\n' +
              '- **Consecutive Failures:** ' + consecutive + '\n' +
              '- **Threshold:** 5\n' +
              '- **Action Taken:** Workflow has been automatically disabled.\n\n' +
              '### Next Steps\n' +
              '1. Investigate root cause via gh run view --log-failed\n' +
              '2. Fix the workflow or underlying issue\n' +
              '3. Re-enable via gh workflow enable\n' +
              '4. Create Jira ticket for tracking if not already done\n\n' +
              '### SLO: MTTR < 24 hours\n' +
              'This workflow must be re-enabled or fixed within 24 hours per KAN-95 SLO.';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body: issueBody,
              labels: ['auto-disabled', 'infrastructure', 'P0'],
            });

            console.log('Created tracking issue for disabled workflow.');

      - name: Log healthy state
        if: steps.count.outputs.consecutive < 5
        run: |
          echo "[OK] Workflow healthy: ${{ steps.count.outputs.consecutive }}/5 consecutive failures"
