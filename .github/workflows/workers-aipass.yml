name: Workers AIPass

on:
  push:
    branches: [main]
    paths:
      - "wrangler.aipass.toml"
      - "worker.js"
  pull_request:
    branches: [main]
    paths:
      - "wrangler.aipass.toml"
      - "worker.js"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

jobs:
  workers-deploy-aipass:
    name: Deploy AIPass Workers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Validate configuration
        continue-on-error: true
        run: |
          if [ ! -f wrangler.aipass.toml ]; then
            echo "::error::wrangler.aipass.toml not found"
            exit 1
          fi
          npx wrangler whoami --config wrangler.aipass.toml

      - name: Dry-run deploy
        continue-on-error: true
        run: npx wrangler deploy --dry-run --config wrangler.aipass.toml

      - name: Deploy to Workers
        if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'production'
        run: npx wrangler deploy --config wrangler.aipass.toml --outdir /tmp/wrangler-deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN_AIPASS }}