name: AI Safety Audit

on:
  push:
    branches: [main, master]
    paths:
      - "project/**"
      - "scripts/**"
      - "rust_core/**"
      - "requirements.txt"
      - ".github/workflows/**"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-review-and-audit:
    name: Pre-Deployment Code Review and Safety Audit
    runs-on: ubuntu-latest
    env:
      # Source-only audit; the release-gating CI job installs the wheel and uses 0.
      HORO_ALLOW_PYTHON_FALLBACK: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore immutable recovery audit ref
        shell: bash
        run: |
          set -euo pipefail
          recovery_refspec="refs/remotes/origin/recovery/pre-test-provenance-20260827:refs/heads/recovery/pre-test-provenance-20260827"
          git show-ref --verify --quiet "${recovery_refspec%%:*}"
          git update-ref "${recovery_refspec#*:}" "${recovery_refspec%%:*}"
          test "$(git log -1 --format=%s recovery/pre-test-provenance-20260827)" = "chore(recovery): preserve pre-gate mixed worktree [NON_TDD_RECONSTRUCTED]"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          grep -vE "mlx|mlx-lm|mlx-metal" requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt pytest

      - name: Execute code reviewer and safety audit
        run: python3 project/core/code_reviewer.py --review --use-python

      - name: Run Cloud Architecture Overview (Full Stack) Regression
        run: python3 scripts/run_cloud_architecture_regression.py

      - name: Run GitHub Actions Workflows Full Regression
        run: python3 scripts/run_github_actions_regression.py
