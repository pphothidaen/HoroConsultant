name: HoroConsultant Kaggle Fine-Tuning Pipeline

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: 'Number of training epochs'
        required: false
        default: '3'

jobs:
  kaggle-finetune:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install kaggle requests python-dotenv pydantic

      - name: Configure Kaggle & Credentials
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
          APP_SUPABASE_KEY: ${{ secrets.APP_SUPABASE_KEY }}
          WANDB_KEY: ${{ secrets.WANDB_KEY }}
        run: |
          mkdir -p ~/.kaggle
          echo "{"username":"${KAGGLE_USERNAME:-pphothidaen}","key":"${KAGGLE_TOKEN}"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json
          echo "[OK] Kaggle credentials configured for GitHub Actions worker."

      - name: Trigger Kaggle Fine-Tuning Pipeline
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
          APP_SUPABASE_KEY: ${{ secrets.APP_SUPABASE_KEY }}
          WANDB_KEY: ${{ secrets.WANDB_KEY }}
        run: |
          python3 scripts/kaggle_notebook_manager.py --push
