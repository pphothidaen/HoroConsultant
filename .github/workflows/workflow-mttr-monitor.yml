name: Workflow MTTR SLO Monitor

# KAN-95: Monitor workflow failure MTTR and alert if SLO breached (MTTR < 24 hours)

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-mttr-monitor
  cancel-in-progress: true

jobs:
  check-mttr:
    name: Check workflow MTTR SLO
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Check active failure windows
        id: mttr
        uses: actions/github-script@v7
        with:
          script: |
            const workflows = [
              { id: 0, name: 'Orchestrator Dispatch' },
              { id: 0, name: 'Production Synthetic Monitoring' },
            ];

            // Find actual workflow IDs
            const allWorkflows = await github.rest.actions.listRepoWorkflows({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const sloHours = 24;
            const failures = [];

            for (const w of allWorkflows.data.workflows) {
              if (!w.name.includes('Orchestrator') && !w.name.includes('Production Synthetic')) {
                continue;
              }

              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: w.id,
                status: 'failure',
                event: 'schedule',
                per_page: 1,
              });

              if (runs.data.workflow_runs.length === 0) continue;

              const latest = runs.data.workflow_runs[0];
              const runTime = new Date(latest.created_at);
              const now = new Date();
              const hoursSinceFailure = (now - runTime) / (1000 * 60 * 60);

              // Check if the latest failure is still ongoing (no success since)
              const recentRuns = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: w.id,
                event: 'schedule',
                per_page: 10,
              });

              let stillFailing = true;
              for (const r of recentRuns.data.workflow_runs) {
                if (r.conclusion === 'success') {
                  stillFailing = false;
                  break;
                }
              }

              if (stillFailing && hoursSinceFailure >= sloHours) {
                failures.push({
                  name: w.name,
                  hours: hoursSinceFailure.toFixed(1),
                  latestRun: latest.html_url,
                });
              }
            }

            core.setOutput('failures', JSON.stringify(failures));
            core.setOutput('breached', failures.length > 0);

      - name: Report SLO status
        run: |
          if [ "${{ steps.mttr.outputs.breached }}" == "true" ]; then
            echo "[SLO BREACH] Workflows exceeding ${SLO_HOURS:-24}h MTTR:"
            echo '${{ steps.mttr.outputs.failures }}'
            exit 1
          else
            echo "[OK] All workflows within MTTR SLO (< 24 hours)"
          fi
