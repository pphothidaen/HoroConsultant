name: Cloudflare Worker Production Monitor

on:
  schedule:
    # Every 15 minutes (free tier compliant - GitHub Actions free tier allows this)
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write  # For creating/updating alert issues

concurrency:
  group: cloudflare-worker-production-monitor
  cancel-in-progress: true

jobs:
  monitor:
    name: Verify Cloudflare Worker production (KAN-173, KAN-174)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # KAN-274 Option A: Cloudflare Worker + D1 durable outbox
      CLOUDFLARE_WORKER_URL: https://horoconsultant-production.pansakorn.workers.dev

    steps:
      - name: Checkout monitored source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Validate canonical target
        id: targets
        run: |
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit

          canonical_worker = "https://horoconsultant-production.pansakorn.workers.dev"
          actual_worker = os.environ.get("CLOUDFLARE_WORKER_URL", "").strip().rstrip("/")

          if actual_worker != canonical_worker:
              print("[ERROR] Cloudflare Worker target is not the canonical production target.")
              raise SystemExit(1)

          parsed = urlsplit(actual_worker)
          if (
              parsed.scheme != "https"
              or not parsed.hostname
              or parsed.username is not None
              or parsed.password is not None
              or parsed.query
              or parsed.fragment
          ):
              print("[ERROR] Canonical Worker URL is malformed.")
              raise SystemExit(1)

          if parsed.hostname != "horoconsultant-production.pansakorn.workers.dev":
              print("[ERROR] Worker URL is not the canonical workers.dev host.")
              raise SystemExit(1)

          print("[OK] Canonical Cloudflare Worker target verified.")
          PY

      - name: Resolve monitor targets without network
        id: preflight
        run: python3 scripts/cloudflare_worker_monitor.py --dry-run

      - name: Run read-only synthetic health monitor for Cloudflare Worker
        id: synthetic
        if: ${{ !cancelled() && steps.targets.outcome == 'success' && steps.preflight.outcome == 'success' }}
        run: |
          python3 scripts/cloudflare_worker_monitor.py \
            --once \
            --timeout 15 \
            --json-output cloudflare-worker-health.json

      - name: Notify on health degradation
        if: ${{ !cancelled() && steps.synthetic.outcome == 'failure' }}
        env:
          HEALTH_ALERT_WEBHOOK_URL: ${{ secrets.HEALTH_ALERT_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path

          report_path = Path("cloudflare-worker-health.json")
          if not report_path.exists():
              print("[INFO] No Cloudflare Worker health report found")
              sys.exit(0)

          with open(report_path) as f:
              data = json.load(f)

          degraded = [r for r in data.get("results", []) if not r.get("healthy")]
          if not degraded:
              print("[OK] No degraded targets in report")
              sys.exit(0)

          # Re-use the monitor's notification logic
          sys.path.insert(0, "scripts")
          from cloudflare_worker_monitor import notify_health_degradation

          ok = notify_health_degradation(data["results"], os.environ)
          if ok:
              print("[OK] Degradation notification sent")
          else:
              print("[WARNING] Notification channels not fully configured or delivery failed")
          PY

      - name: Create/update GitHub issue on degradation
        if: ${{ !cancelled() && steps.synthetic.outcome == 'failure' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          import subprocess

          report_path = Path("cloudflare-worker-health.json")
          if not report_path.exists():
              sys.exit(0)

          with open(report_path) as f:
              data = json.load(f)

          degraded = [r for r in data.get("results", []) if not r.get("healthy") and r.get("critical")]
          if not degraded:
              print("[OK] No critical degradation found")
              sys.exit(0)

          # Build issue content
          title = "[ALERT] Cloudflare Worker production health degradation"
          body = f"## Cloudflare Worker Health Degradation Detected\n\n"
          body += f"**Workflow Run:** {os.environ.get('GITHUB_RUN_ID', 'unknown')}\n"
          body += f"**Checked At:** {data.get('timestamp_utc', 'unknown')}\n\n"
          body += "### Degraded Targets\n\n"
          for result in degraded:
              body += f"- **{result['target']}** (CRITICAL)\n"
              body += f"  - URL: {result['url']}\n"
              body += f"  - Status: HTTP {result['status']}\n"
              body += f"  - Latency: {result['latency_ms']:.0f}ms\n"
              if result.get('error'):
                  body += f"  - Error: {result['error']}\n"
              body += "\n"

          body += "### Diagnostic Steps\n\n"
          body += "1. Check Cloudflare Worker logs in dashboard\n"
          body += "2. Verify D1 database connectivity (SYNC_STATE binding)\n"
          body += "3. Check Render backend health (primary origin)\n"
          body += "4. Verify Turnstile secret is configured\n\n"
          body += "---\n*Auto-generated by Cloudflare Worker Production Monitor*"

          # Check if issue already exists
          result = subprocess.run(
              ["gh", "issue", "list", "--label", "cloudflare-worker-monitor", "--state", "open", "--json", "number,title"],
              capture_output=True, text=True, cwd="/github/workspace"
          )

          if result.returncode == 0 and result.stdout.strip():
              issues = json.loads(result.stdout)
              existing = None
              for issue in issues:
                  if "Cloudflare Worker production health" in issue["title"]:
                      existing = issue
                      break

              if existing:
                  # Update existing issue
                  subprocess.run(
                      ["gh", "issue", "edit", str(existing["number"]), "--body", body],
                      check=True, cwd="/github/workspace"
                  )
                  print(f"[OK] Updated existing issue #{existing['number']}")
              else:
                  # Create new issue
                  subprocess.run(
                      ["gh", "issue", "create", "--title", title, "--body", body, "--label", "cloudflare-worker-monitor,monitoring,production"],
                      check=True, cwd="/github/workspace"
                  )
                  print("[OK] Created new GitHub issue for degradation")
          else:
              print("[WARNING] Could not query existing issues")
              PY

      - name: Close GitHub issue on recovery
        if: ${{ !cancelled() && steps.synthetic.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          import subprocess

          report_path = Path("cloudflare-worker-health.json")
          if not report_path.exists():
              sys.exit(0)

          with open(report_path) as f:
              data = json.load(f)

          # Only close if all critical targets are healthy
          if not data.get("all_critical_healthy", False):
              print("[INFO] Critical targets still degraded, keeping issue open")
              sys.exit(0)

          # Find and close existing issue
          result = subprocess.run(
              ["gh", "issue", "list", "--label", "cloudflare-worker-monitor", "--state", "open", "--json", "number,title"],
              capture_output=True, text=True, cwd="/github/workspace"
          )

          if result.returncode == 0 and result.stdout.strip():
              issues = json.loads(result.stdout)
              for issue in issues:
                  if "Cloudflare Worker production health" in issue["title"]:
                      subprocess.run(
                          ["gh", "issue", "close", str(issue["number"]), "--comment", "Auto-closed: All critical targets recovered"],
                          check=True, cwd="/github/workspace"
                      )
                      print(f"[OK] Closed issue #{issue['number']} - recovery confirmed")
                      break
              else:
                  print("[OK] No open issue to close")
          else:
              print("[OK] No open issues found")
          PY

      - name: Upload sanitized monitor evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cloudflare-worker-monitor-${{ github.sha }}
          path: |
            cloudflare-worker-health.json
          if-no-files-found: warn