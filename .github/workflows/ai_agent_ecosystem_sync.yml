name: AI Agent Ecosystem Sync

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync-check:
    name: Validate cross-platform agent sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install -q PyYAML

      - name: Check AI agent ecosystem sync
        run: python scripts/sync_ai_agent_ecosystem.py --check
