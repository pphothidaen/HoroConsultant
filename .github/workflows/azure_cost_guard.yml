name: Azure Free Grant Guard

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-free-grant-guard
  cancel-in-progress: false

jobs:
  enforce:
    name: Disable ingress before paid consumption
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install Azure Container Apps extension
        run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Evaluate all subscription Container Apps and enforce cutoff
        run: |
          python3 scripts/azure_usage_guard.py \
            --subscription 0aca09b2-2917-4d8f-aef8-1a4da965d7dc \
            --resource-group rg-horoconsult \
            --app-name horoconsult-env-new \
            --threshold 0.70 \
            --enforce \
            --resume-after-reset
