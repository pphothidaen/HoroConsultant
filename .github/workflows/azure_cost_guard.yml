name: "[RETIRED] Azure Free Grant Guard"

# Dormant audit tombstone. The former scheduled guard required authenticated
# provider access and could alter ingress. It is retained only so repository
# history and the retired workflow name remain discoverable.
on:
  workflow_dispatch:

permissions: {}

jobs:
  retired:
    name: Azure cost guard is permanently inactive
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Retirement notice
        run: |
          echo "[ERROR] Azure cost guard is retired; no provider operation is permitted."
          exit 1
