name: Hugging Face Docker Backend - Production Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hf-backend-production
  cancel-in-progress: false

jobs:
  publish-and-verify:
    name: Publish public API and verify production path
    runs-on: ubuntu-latest
    environment: production
    env:
      HF_BACKEND_SPACE_ID: ${{ vars.HF_BACKEND_SPACE_ID || 'pphothidaen/horoconsultant-core-api' }}
      HF_STATIC_SPACE_ID: ${{ vars.HF_STATIC_SPACE_ID || 'pphothidaen/horoconsultant-core-backend' }}
      HF_BACKEND_URL: ${{ vars.HF_BACKEND_URL || 'https://pphothidaen-horoconsultant-core-api.hf.space' }}
      HF_STATIC_CDN_URL: ${{ vars.HF_STATIC_CDN_URL || 'https://pphothidaen-horoconsultant-core-backend.static.hf.space' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID || vars.AWS_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY || vars.AWS_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY || vars.AWS_SECRET_ACCESS_KEY || secrets.AWS_SECRET_KEY || vars.AWS_SECRET_KEY }}
      AWS_ENDPOINT_URL: ${{ vars.AWS_ENDPOINT_URL || secrets.AWS_ENDPOINT_URL }}
      VERCEL_GATEWAY_URL: ${{ vars.VERCEL_GATEWAY_URL || 'https://horo-consultant-psi.vercel.app' }}
    steps:
      - uses: actions/checkout@v4

      - name: Doppler Secret Sync (1st Priority)
        uses: dopplerhq/secrets-fetch-action@v1.2.0
        continue-on-error: true
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          inject-env-vars: true
        id: doppler

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deployment dependencies
        run: pip install huggingface_hub httpx python-dotenv

      - name: Resolve HF token source
        env:
          HF_TOKEN: >-
            ${{ steps.doppler.outputs.HF_TOKEN ||
            steps.doppler.outputs.HUGGINGFACE_TOKEN ||
            steps.doppler.outputs.HF_API_TOKEN ||
            steps.doppler.outputs.HUGGINGFACE_API_KEY ||
            steps.doppler.outputs.HUGGING_FACE_TOKEN ||
            secrets.HF_TOKEN || vars.HF_TOKEN ||
            secrets.HUGGINGFACE_TOKEN || vars.HUGGINGFACE_TOKEN ||
            secrets.HF_API_TOKEN || vars.HF_API_TOKEN ||
            secrets.HUGGINGFACE_API_KEY || vars.HUGGINGFACE_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          token_candidates = [
              ("HF_TOKEN", os.getenv("HF_TOKEN")),
              ("HUGGINGFACE_TOKEN", os.getenv("HUGGINGFACE_TOKEN")),
              ("HF_API_TOKEN", os.getenv("HF_API_TOKEN")),
              ("HUGGINGFACE_API_KEY", os.getenv("HUGGINGFACE_API_KEY")),
              ("HUGGING_FACE_TOKEN", os.getenv("HUGGING_FACE_TOKEN")),
          ]

          token = None
          token_source = "not-found"
          for name, value in token_candidates:
              if value:
                  token = value
                  token_source = name
                  break

          env_file = os.getenv("GITHUB_ENV")
          print(f"[INFO] Token resolved from: {token_source}")
          if token:
            print("[OK] HF token resolved for deployment.")
            if env_file:
              with open(env_file, "a", encoding="utf-8") as f:
                  f.write(f\"HF_TOKEN={token}\\n\")
                  f.write("HF_TOKEN_SOURCE=resolve-step\\n")
          else:
            print("[ERROR] HF token could not be resolved from env/secrets.")
            raise SystemExit(1)
          PY

      - name: Publish static frontend
        run: python3 scripts/publish_space_hf.py --space-id "$HF_STATIC_SPACE_ID" --sdk static

      - name: Publish Docker API backend
        run: python3 scripts/publish_space_hf.py --space-id "$HF_BACKEND_SPACE_ID" --sdk docker

      - name: Wait for public backend and verify complete path
        run: |
          for attempt in $(seq 1 18); do
            if python3 scripts/run_live_health_verification.py --json-output production-verification.json; then
              exit 0
            fi
            echo "[INFO] Public backend still starting; retrying in 20 seconds"
            sleep 20
          done
          exit 1

      - name: Run synthetic monitor
        run: python3 scripts/synthetic_health_monitor.py --once --json-output synthetic-health.json

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hf-production-verification-${{ github.sha }}
          path: |
            production-verification.json
            synthetic-health.json
          if-no-files-found: warn
