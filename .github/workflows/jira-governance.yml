name: Jira PR & CI Governance

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

jobs:
  validate-pr-title:
    name: Validate Jira Issue Key Prefix
    runs-on: ubuntu-latest
    steps:
      - name: Enforce Regex Convention
        uses: actions/github-script@v7
        with:
          script: |
            if (!context.payload.pull_request) {
              console.log("Push event on main; skipping PR title validation.");
              return;
            }
            const title = context.payload.pull_request.title;
            const regex = /^\[KAN-\d+\](\[KAN-\d+\])*\s.+$/;
            if (!regex.test(title)) {
              core.setFailed(
                `PR title "${title}" is invalid. It must begin with one or more Jira Issue Keys, e.g., "[KAN-69] Fix render.yaml" or "[KAN-71][KAN-72] Docs: Incident closure".`
              );
            }

  notify-agent-on-failure:
    name: Autonomous CI Failure Callback
    needs: [validate-pr-title]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Event to Hermes Agent
        env:
          HERMES_TOKEN: ${{ secrets.HERMES_AGENT_TOKEN }}
          HERMES_WEBHOOK_URL: ${{ secrets.HERMES_ORCHESTRATOR_WEBHOOK }}
          # PR-controlled values are passed via env, never interpolated into
          # the shell body, to avoid script injection (actionlint expression rule).
          GH_REPOSITORY: ${{ github.repository }}
          GH_PR_NUMBER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'null' }}
          GH_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          GH_SHA: ${{ github.sha }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          TIMESTAMP=$(date +%s)
          # Build the payload with jq from env vars so untrusted input is never
          # spliced into the script, and the exact bytes hashed are the exact
          # bytes transmitted.
          BODY=$(jq -nc \
            --arg event "CI_FAILURE" \
            --arg repository "$GH_REPOSITORY" \
            --arg branch "$GH_BRANCH" \
            --arg commit_sha "$GH_SHA" \
            --arg run_id "$GH_RUN_ID" \
            --argjson pr_number "$GH_PR_NUMBER" \
            '{event: $event, repository: $repository, pr_number: $pr_number,
              branch: $branch, commit_sha: $commit_sha, run_id: $run_id}')

          # Hermes V2 signature: HMAC-SHA256 over "${TIMESTAMP}.${BODY}"
          # (see hermes-webhook-bridge/references/hmac-signature.md)
          SIG=$(printf '%s' "${TIMESTAMP}.${BODY}" \
            | openssl dgst -sha256 -hmac "$HERMES_TOKEN" -hex \
            | awk '{print $NF}')

          # -fS so a 4xx/5xx (bad or missing secret) FAILS the step instead of
          # exiting 0 and silently disabling the callback.
          curl -fsS -X POST "$HERMES_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Timestamp: $TIMESTAMP" \
            -H "X-Webhook-Signature-V2: $SIG" \
            -d "$BODY"