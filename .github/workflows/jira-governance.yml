name: Jira PR & CI Governance

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

jobs:
  validate-pr-title:
    name: Validate Jira Issue Key Prefix
    runs-on: ubuntu-latest
    steps:
      - name: Enforce Regex Convention
        uses: actions/github-script@v7
        with:
          script: |
            if (!context.payload.pull_request) {
              console.log("Push event on main; skipping PR title validation.");
              return;
            }
            const title = context.payload.pull_request.title;
            const regex = /^\[KAN-\d+\](\[KAN-\d+\])*\s.+$/;
            if (!regex.test(title)) {
              core.setFailed(
                `PR title "${title}" is invalid. It must begin with one or more Jira Issue Keys, e.g., "[KAN-69] Fix render.yaml" or "[KAN-71][KAN-72] Docs: Incident closure".`
              );
            }

  notify-agent-on-failure:
    name: Autonomous CI Failure Callback
    needs: [validate-pr-title]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Event to Hermes Agent
        run: |
          curl -s -X POST "${{ secrets.HERMES_ORCHESTRATOR_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.HERMES_AGENT_TOKEN }}" \
            -d '{
              "event": "CI_FAILURE",
              "repository": "${{ github.repository }}",
              "pr_number": ${{ github.event.pull_request.number || "null" }},
              "branch": "${{ github.event.pull_request.head.ref || github.ref_name }}",
              "commit_sha": "${{ github.sha }}",
              "run_id": "${{ github.run_id }}"
            }'