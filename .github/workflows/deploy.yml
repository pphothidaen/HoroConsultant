name: Azure Container Apps Production Release

on:
  workflow_run:
    workflows:
      - Unified CI & Quality Audit Pipeline
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-container-apps-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  AZURE_SUBSCRIPTION_ID: 0aca09b2-2917-4d8f-aef8-1a4da965d7dc
  AZURE_RESOURCE_GROUP: rg-horoconsult
  AZURE_CONTAINER_APP: horoconsult-env-new

jobs:
  release:
    name: Build once, publish, and deploy verified digest
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout the exact CI-verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve immutable source identity
        id: source
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if ! [[ "${VERIFIED_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid source SHA" >&2
            exit 1
          fi
          echo "sha=${VERIFIED_SHA}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${VERIFIED_SHA:0:12}" >> "${GITHUB_OUTPUT}"

      - name: Azure login with repository secret
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install Azure Container Apps extension
        run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Enforce free-grant safety gate before building
        run: |
          python3 scripts/azure_usage_guard.py \
            --subscription "${AZURE_SUBSCRIPTION_ID}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --app-name "${AZURE_CONTAINER_APP}" \
            --threshold 0.70 \
            --enforce \
            --resume-after-reset

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Select immutable and convenience tags
        id: tags
        env:
          SHORT_SHA: ${{ steps.source.outputs.short_sha }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -euo pipefail
          set +e
          tag_status="$(python3 scripts/dockerhub_tag_policy.py \
            --namespace pansakorn \
            --repository horoconsult \
            --tag v1.0)"
          tag_status_code=$?
          set -e
          if [ "${tag_status_code}" -eq 0 ] && [ "${tag_status}" = "EXISTS" ]; then
            publish_v1=0
            echo "v1.0 already exists; preserving immutable tag" >&2
          elif [ "${tag_status_code}" -eq 4 ] && [ "${tag_status}" = "MISSING" ]; then
            publish_v1=1
          else
            echo "Unable to prove v1.0 tag state; refusing release" >&2
            exit 1
          fi
          {
            echo 'tags<<EOF'
            echo "pansakorn/horoconsult:sha-${SHORT_SHA}"
            echo "pansakorn/horoconsult:latest"
            if [ "${publish_v1}" -eq 1 ]; then
              echo "pansakorn/horoconsult:v1.0"
            fi
            echo 'EOF'
          } >> "${GITHUB_OUTPUT}"

      - name: Build Linux AMD64 image and push once
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            GIT_COMMIT_HASH=${{ steps.source.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Verify the pushed OCI platform before deployment
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if ! [[ "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid OCI image digest" >&2
            exit 1
          fi
          inspect_output="$(docker buildx imagetools inspect \
            "docker.io/pansakorn/horoconsult@${IMAGE_DIGEST}")"
          if ! grep -Eq 'Platform:[[:space:]]+linux/amd64' <<< "${inspect_output}"; then
            echo "Published image has no Linux AMD64 manifest" >&2
            exit 1
          fi
          unexpected_platforms="$(sed -n \
            's/^[[:space:]]*Platform:[[:space:]]*//p' <<< "${inspect_output}" \
            | grep -Ev '^(linux/amd64|unknown/unknown)$' || true)"
          if [ -n "${unexpected_platforms}" ]; then
            echo "Published image contains an unexpected runtime platform" >&2
            exit 1
          fi

      - name: Configure private Docker Hub pull
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -euo pipefail
          az containerapp registry set \
            --resource-group rg-horoconsult \
            --name horoconsult-env-new \
            --server index.docker.io \
            --username "${DOCKER_USERNAME}" \
            --password "${DOCKER_PASSWORD}" \
            --only-show-errors

      - name: Apply the verified zero-idle-cost runtime boundary
        run: |
          set -euo pipefail
          az containerapp env update \
            --resource-group rg-horoconsult \
            --name managedEnvironment-rghoroconsult-b5b1 \
            --logs-destination none \
            --only-show-errors
          az containerapp revision set-mode \
            --resource-group rg-horoconsult \
            --name horoconsult-env-new \
            --mode multiple \
            --only-show-errors

      - name: Deploy the immutable image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if ! [[ "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid OCI image digest" >&2
            exit 1
          fi
          az containerapp update \
            --resource-group rg-horoconsult \
            --name horoconsult-env-new \
            --image "docker.io/pansakorn/horoconsult@${IMAGE_DIGEST}" \
            --min-replicas 0 \
            --max-replicas 1 \
            --only-show-errors
          az containerapp ingress enable \
            --resource-group rg-horoconsult \
            --name horoconsult-env-new \
            --type external \
            --target-port 8000 \
            --transport auto \
            --only-show-errors
          az containerapp ingress traffic set \
            --resource-group rg-horoconsult \
            --name horoconsult-env-new \
            --revision-weight latest=100 \
            --only-show-errors

      - name: Verify cold-start health from Azure ingress
        run: |
          set -euo pipefail
          fqdn="$(az containerapp show \
            --resource-group rg-horoconsult \
            --name horoconsult-env-new \
            --query properties.configuration.ingress.fqdn \
            --output tsv \
            --only-show-errors)"
          test -n "${fqdn}"
          curl --fail --show-error --silent \
            --retry 12 --retry-delay 10 --retry-all-errors \
            "https://${fqdn}/health"

      - name: Publish release identity
        run: |
          echo "source_sha=${{ steps.source.outputs.sha }}"
          echo "image_digest=${{ steps.build.outputs.digest }}"
