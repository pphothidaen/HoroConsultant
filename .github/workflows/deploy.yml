name: "[RETIRED] Azure Container Apps Production Release"

# Audit-only tombstone. Keeping this workflow visible preserves repository
# history while ensuring a push to main can never start an Azure deployment.
on:
  workflow_dispatch:

permissions: {}

jobs:
  retired:
    name: Azure production deployment is prohibited
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Retirement notice
        run: |
          echo "::error::Azure public deployment is retired. Use the governed Hugging Face Docker backend workflow."
          exit 1
