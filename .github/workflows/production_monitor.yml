name: Production Synthetic Monitoring

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-synthetic-monitor
  cancel-in-progress: true

jobs:
  monitor:
    name: Verify Render backend and Vercel UI (KAN-173, KAN-274, KAN-275/276)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      # KAN-274 Option A: Render + Cloudflare D1 (HF Static retired per KAN-275/276)
      RENDER_BACKEND_URL: https://horoconsultant-core-backend.onrender.com
      VERCEL_STATIC_URL: https://horo-consultant-psi.vercel.app

    steps:
      - name: Checkout monitored source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Validate canonical separated targets
        id: targets
        run: |
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit

          canonical_space = "pphothidaen/horoconsultant-core-backend"
          canonical_backend = "https://horoconsultant-core-backend.onrender.com"
          canonical_ui = "https://horo-consultant-psi.vercel.app"

          actual_backend = os.environ.get("RENDER_BACKEND_URL", "").strip().rstrip("/")
          actual_ui = os.environ.get("VERCEL_STATIC_URL", "").strip().rstrip("/")

          if actual_backend != canonical_backend:
              print("[ERROR] Render backend target is not the canonical production target.")
              raise SystemExit(1)
          if actual_ui != canonical_ui:
              print("[ERROR] Vercel UI target is not the canonical production target.")
              raise SystemExit(1)
          if actual_backend == actual_ui:
              print("[ERROR] Backend and UI targets must be distinct.")
              raise SystemExit(1)

          for label, value in (("backend", actual_backend), ("ui", actual_ui)):
              parsed = urlsplit(value)
              if (
                  parsed.scheme != "https"
                  or not parsed.hostname
                  or parsed.username is not None
                  or parsed.password is not None
                  or parsed.query
                  or parsed.fragment
              ):
                  print(f"[ERROR] Canonical {label} URL is malformed.")
                  raise SystemExit(1)

          if urlsplit(actual_backend).hostname != "horoconsultant-core-backend.onrender.com":
              print("[ERROR] Backend URL is not the canonical Render host.")
              raise SystemExit(1)
          if urlsplit(actual_ui).hostname != "horo-consultant-psi.vercel.app":
              print("[ERROR] UI URL is not the canonical Vercel host.")
              raise SystemExit(1)

          print("[OK] Canonical Render backend and Vercel UI targets are separated.")
          PY

      - name: Resolve monitor targets without network
        id: preflight
        run: python3 scripts/synthetic_health_monitor.py --dry-run

      - name: Verify exact release identity on backend and UI
        id: version
        if: ${{ !cancelled() && steps.targets.outcome == 'success' && steps.preflight.outcome == 'success' }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          report_path = Path("production-version-identity.json")
          report = {
              "schema_version": "production-version-monitor-v1",
              "checked_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "backend_target": os.environ["RENDER_BACKEND_URL"],
              "backend_sdk": "docker",
              "vercel_ui_target": os.environ["VERCEL_STATIC_URL"],
              "success": False,
              "surfaces": [],
          }

          class ContractError(ValueError):
              pass

          def reject_duplicate_keys(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise ContractError(f"duplicate key: {key}")
                  value[key] = item
              return value

          def load_json_bytes(raw):
              value = json.loads(raw.decode("utf-8"), object_pairs_hook=reject_duplicate_keys)
              if not isinstance(value, dict):
                  raise ContractError("metadata root must be an object")
              return value

          try:
              source_path = Path("project/static/version.json")
              public_path = Path("public/version.json")
              source = load_json_bytes(source_path.read_bytes())
              public = load_json_bytes(public_path.read_bytes())
              if source != public:
                  raise ContractError("committed release metadata mirrors differ")

              required = (
                  "version",
                  "release_source_commit",
                  "release_source_revision",
                  "release_source_metadata_path",
                  "release_source_metadata_sha256",
              )
              missing = [key for key in required if key not in source]
              if missing:
                  raise ContractError("committed release metadata is incomplete")
              if any(key in source for key in ("commit", "packaging_commit")):
                  raise ContractError("committed release metadata contains a forbidden identity")

              version = source["version"]
              source_commit = source["release_source_commit"]
              source_revision = source["release_source_revision"]
              source_metadata_path = source["release_source_metadata_path"]
              source_metadata_digest = source["release_source_metadata_sha256"]
              if not isinstance(version, str) or not re.fullmatch(r"\d+\.\d+\.\d+\.([0-9a-f]{7,40})", version):
                  raise ContractError("release version is malformed")
              if not isinstance(source_commit, str) or not re.fullmatch(r"[0-9a-f]{7,40}", source_commit):
                  raise ContractError("release source commit is malformed")
              if not isinstance(source_revision, str) or not re.fullmatch(r"[0-9a-f]{40}", source_revision):
                  raise ContractError("release source revision is malformed")
              if source_metadata_path != "project/static/version.json":
                  raise ContractError("release source metadata path is not canonical")
              if not isinstance(source_metadata_digest, str) or not re.fullmatch(r"[0-9a-f]{64}", source_metadata_digest):
                  raise ContractError("release source metadata digest is malformed")
              if version.rsplit(".", 1)[1] != source_commit:
                  raise ContractError("release version and source commit disagree")

              canonical = json.dumps(
                  {
                      "release_source_commit": source_commit,
                      "release_source_metadata_path": source_metadata_path,
                      "release_source_revision": source_revision,
                      "version": version,
                  },
                  sort_keys=True,
                  separators=(",", ":"),
              ).encode("utf-8")
              if hashlib.sha256(canonical).hexdigest() != source_metadata_digest:
                  raise ContractError("release source metadata digest disagrees")

              resolved_revision = subprocess.check_output(
                  ["git", "rev-parse", "--verify", f"{source_commit}^{{commit}}"],
                  stderr=subprocess.DEVNULL,
                  text=True,
                  timeout=3,
              ).strip()
              if resolved_revision != source_revision:
                  raise ContractError("release source revision cannot be reproduced")
              packaging_commit = subprocess.check_output(
                  ["git", "rev-parse", "HEAD"],
                  stderr=subprocess.DEVNULL,
                  text=True,
                  timeout=3,
              ).strip()
              ancestry = subprocess.run(
                  ["git", "merge-base", "--is-ancestor", source_revision, packaging_commit],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  timeout=3,
                  check=False,
              )
              if ancestry.returncode != 0:
                  raise ContractError("release source is not an ancestor of packaging commit")

              report.update(
                  {
                      "version": version,
                      "release_source_commit": source_commit,
                      "release_source_revision": source_revision,
                      "release_source_metadata_path": source_metadata_path,
                      "release_source_metadata_sha256": source_metadata_digest,
                      "packaging_commit": packaging_commit,
                  }
              )

              surfaces = (
                  ("render_backend", os.environ["RENDER_BACKEND_URL"].rstrip("/") + "/version.json"),
                  ("vercel_ui", os.environ["VERCEL_STATIC_URL"].rstrip("/") + "/version.json"),
              )
              for label, url in surfaces:
                  request = urllib.request.Request(
                      url,
                      headers={
                          "Accept": "application/json",
                          "Cache-Control": "no-cache",
                          "User-Agent": "HoroConsultant-VersionMonitor/1.0",
                      },
                      method="GET",
                  )
                  with urllib.request.urlopen(request, timeout=15) as response:
                      raw = response.read(1_048_577)
                      status = response.status
                      final_url = response.geturl().rstrip("/")
                  if final_url != url.rstrip("/"):
                      raise ContractError(f"{label} version surface redirected unexpectedly")
                  if status != 200 or len(raw) > 1_048_576:
                      raise ContractError(f"{label} version surface is unavailable")
                  deployed = load_json_bytes(raw)
                  if any(key in deployed for key in ("commit", "packaging_commit")):
                      raise ContractError(f"{label} contains a forbidden identity")
                  if deployed != source:
                      raise ContractError(f"{label} release identity is stale or conflicting")
                  report["surfaces"].append(
                      {
                          "target": label,
                          "status": status,
                          "matched": True,
                          "response_sha256": hashlib.sha256(raw).hexdigest(),
                      }
                  )

              if len(report["surfaces"]) != 2:
                  raise ContractError("required identity surface cardinality is not exact")
              report["success"] = True
              print("[OK] Exact release identity matches Render backend and Vercel UI.")
          except Exception as error:
              report["error_class"] = type(error).__name__
              print(f"[ERROR] Exact release identity verification failed: {type(error).__name__}.")
          finally:
              report_path.write_text(
                  json.dumps(report, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )

          raise SystemExit(0 if report["success"] else 1)
          PY

      - name: Verify public production path
        id: path
        if: ${{ !cancelled() && steps.targets.outcome == 'success' && steps.preflight.outcome == 'success' }}
        run: |
          python3 scripts/run_live_health_verification.py \
            --timeout 15 \
            --json-output production-verification.json

      - name: Run read-only synthetic health monitor
        id: synthetic
        if: ${{ !cancelled() && steps.targets.outcome == 'success' && steps.preflight.outcome == 'success' }}
        run: |
          python3 scripts/synthetic_health_monitor.py \
            --once \
            --timeout 15 \
            --json-output synthetic-health.json

      - name: Notify on health degradation
        if: ${{ !cancelled() && steps.synthetic.outcome == 'failure' }}
        env:
          HEALTH_ALERT_WEBHOOK_URL: ${{ secrets.HEALTH_ALERT_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          
          report_path = Path("synthetic-health.json")
          if not report_path.exists():
              print("[INFO] No synthetic health report found")
              sys.exit(0)
          
          with open(report_path) as f:
              data = json.load(f)
          
          degraded = [r for r in data.get("results", []) if not r.get("healthy")]
          if not degraded:
              print("[OK] No degraded targets in report")
              sys.exit(0)
          
          # Re-use the monitor's notification logic
          sys.path.insert(0, "scripts")
          from synthetic_health_monitor import notify_health_degradation
          
          ok = notify_health_degradation(data["results"], os.environ)
          if ok:
              print("[OK] Degradation notification sent")
          else:
              print("[WARNING] Notification channels not fully configured or delivery failed")
          PY

      - name: Upload sanitized monitor evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-monitor-${{ github.sha }}
          path: |
            production-version-identity.json
            production-verification.json
            synthetic-health.json
          if-no-files-found: warn
