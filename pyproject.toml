[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "horoconsultant"
version = "1.0.0"
description = "HoroConsultant — Computational Metaphysics Engine & FastAPI Backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.8",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "jsonschema>=4.23,<5",
    "httpx>=0.27.0",
    "requests>=2.32.0",
    "cryptography>=42.0.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.24.0",
    "geopy>=2.4.0",
    "timezonefinder>=6.0.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "starlette>=1.3.1",
    "h11>=0.16.0"
]

[tool.setuptools.packages.find]
include = ["project*"]
