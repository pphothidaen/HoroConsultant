L`) with automatic fallback to `CODEX_PRO` or Gemini direct when 9router is unavailable.\n7. **HF Static Final Decision Owner**: Approve a production release only after DevOps, QA, and Code Reviewer provide current green health, exact-cardinality version, regression, screenshot, and machine-readable evidence. Otherwise record `[ERROR] BLOCKED`.\n\n\n## Codex compatibility guidance\n- Legacy source: `.agents/agents/orchestrator/agent.json`.\n- The legacy source remains authoritative; do not edit generated Codex TOML manually.\n- Model-allocation statements above are historical context only; inherit the active Codex model.\n- When the task matches their descriptions, use the relevant repository skills: `$bazi-calculator`, `$rag-search`, `$bsa-doc-skill-management`, `$qa-e2e-testing`, `$devops-deployment`, `$sdlc-aisdlc-workflow`, `$metaphysical-domain-engine`, `$hf-static-release-verification`, `$adaptive-model-effort-routing`.\n"
